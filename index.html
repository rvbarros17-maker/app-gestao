<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totaliz - Gestão Inteligente</title>
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Totaliz">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    const firebaseConfig = {
      apiKey: "AIzaSyAXJReFAHvGx8oqX3KU7yB37L8fNa3DkiA",
      authDomain: "app-gestao-47669.firebaseapp.com",
      projectId: "app-gestao-47669",
      storageBucket: "app-gestao-47669.firebasestorage.app",
      messagingSenderId: "33460108207",
      appId: "1:33460108207:web:29fd5d0ed97c44e92a4d5a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let state = {
      user: null,
      showLoginScreen: true,
      loginMode: 'login',
      activeTab: 'dashboard',
      modalTipo: null,
      insumos: [],
      receitas: [],
      produtos: [],
      clientes: [],
      vendas: [],
      movimentacoes: [],
      caixas: [],
      caixaAtual: null,
      despesasRecorrentes: [],
      showModal: false,
      modalType: '',
      editingId: null,
      loading: true
    };


    // ===== SISTEMA DE AUTENTICAÇÃO =====
    onAuthStateChanged(auth, (user) => {
      if (user) {
        state.user = user;
        state.showLoginScreen = false;
    

      // ===== FLUXO DE CAIXA =====
      document.querySelectorAll('[data-action="save-abrir-caixa"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const saldoInicial = parseFloat(document.getElementById('saldoInicial').value) || 0;
          
          const novoCaixa = {
            id: Date.now(),
            dataAbertura: new Date().toISOString(),
            saldoInicial,
            saldoFinal: 0,
            status: 'aberto'
          };
          
          await saveToFirebase('caixas', novoCaixa.id, novoCaixa);
          state.caixas.push(novoCaixa);
          state.caixaAtual = novoCaixa;
          
          state.showModal = false;
          render();
        });
      });

      document.querySelectorAll('[data-action="save-sangria"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const valor = parseFloat(document.getElementById('valorSangria').value);
          const motivo = document.getElementById('motivoSangria').value;
          
          if (!valor || !motivo) return alert('Preencha todos os campos');
          
          const mov = {
            id: Date.now(),
            tipo: 'saida',
            categoria: 'sangria',
            data: new Date().toISOString(),
            descricao: `Sangria: ${motivo}`,
            valor
          };
          
          await saveToFirebase('movimentacoes', mov.id, mov);
          state.movimentacoes.push(mov);
          
          state.showModal = false;
          render();
        });
      });

      document.querySelectorAll('[data-action="save-reforco"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const valor = parseFloat(document.getElementById('valorReforco').value);
          const motivo = document.getElementById('motivoReforco').value;
          
          if (!valor || !motivo) return alert('Preencha todos os campos');
          
          const mov = {
            id: Date.now(),
            tipo: 'entrada',
            categoria: 'reforco',
            data: new Date().toISOString(),
            descricao: `Reforço: ${motivo}`,
            valor
          };
          
          await saveToFirebase('movimentacoes', mov.id, mov);
          state.movimentacoes.push(mov);
          
          state.showModal = false;
          render();
        });
      });

      document.querySelectorAll('[data-action="save-despesa"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const valor = parseFloat(document.getElementById('valorDespesa').value);
          const descricao = document.getElementById('descricaoDespesa').value;
          const categoria = document.getElementById('categoriaDespesa').value;
          
          if (!valor || !descricao) return alert('Preencha todos os campos');
          
          const mov = {
            id: Date.now(),
            tipo: 'saida',
            categoria,
            data: new Date().toISOString(),
            descricao,
            valor
          };
          
          await saveToFirebase('movimentacoes', mov.id, mov);
          state.movimentacoes.push(mov);
          
          state.showModal = false;
          render();
        });
      });

      // Calcular diferença no fechamento de caixa
      const saldoRealInput = document.getElementById('saldoReal');
      if (saldoRealInput && state.modalType === 'fechar-caixa') {
        saldoRealInput.addEventListener('input', () => {
          const movHoje = state.movimentacoes.filter(m => new Date(m.data).toDateString() === new Date().toDateString());
          const entradas = movHoje.filter(m => m.tipo === 'entrada').reduce((t, m) => t + m.valor, 0);
          const saidas = movHoje.filter(m => m.tipo === 'saida').reduce((t, m) => t + m.valor, 0);
          const saldoCalculado = state.caixaAtual.saldoInicial + entradas - saidas;
          const saldoReal = parseFloat(saldoRealInput.value) || 0;
          const diferenca = saldoReal - saldoCalculado;
          
          const diferencaDiv = document.getElementById('diferenca-caixa');
          if (diferencaDiv && diferenca !== 0) {
            diferencaDiv.innerHTML = `
              <div class="p-3 rounded ${diferenca > 0 ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}">
                <p class="text-sm font-medium ${diferenca > 0 ? 'text-green-700' : 'text-red-700'}">
                  ${diferenca > 0 ? 'Sobra' : 'Falta'}: R$ ${Math.abs(diferenca).toFixed(2)}
                </p>
              </div>
            `;
          } else if (diferencaDiv) {
            diferencaDiv.innerHTML = '';
          }
        });
      }

    loadAllData();
      } else {
        state.user = null;
        state.showLoginScreen = true;
        state.loading = false;
        render();
      }
    });

    async function handleLogin(email, password) {
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        if (error.code === 'auth/invalid-credential') {
          alert('Email ou senha incorretos!');
        } else {
          alert('Erro ao fazer login: ' + error.message);
        }
      }
    }

    async function handleRegister(email, password, confirmPassword) {
      if (password !== confirmPassword) return alert('As senhas não coincidem!');
      if (password.length < 6) return alert('A senha deve ter pelo menos 6 caracteres!');
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert('✅ Conta criada com sucesso! Faça login.');
        state.loginMode = 'login';
        render();
      } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
          alert('Este email já está cadastrado!');
        } else {
          alert('Erro ao criar conta: ' + error.message);
        }
      }
    }

    async function handleLogout() {
      if (confirm('Deseja realmente sair?')) {
        await signOut(auth);
        state.insumos = [];
        state.receitas = [];
        state.produtos = [];
        state.clientes = [];
        state.vendas = [];
        state.movimentacoes = [];
      }
    }

    async function saveToFirebase(collectionName, id, data) {
      try {
        const dataWithUser = { ...data, userId: state.user.uid };
        await setDoc(doc(db, collectionName, String(id)), dataWithUser);
        return true;
      } catch (e) {
        console.error('Erro ao salvar:', e);
        alert('Erro ao salvar dados. Tente novamente.');
        return false;
      }
    }

    async function loadFromFirebase(collectionName) {
      try {
        const q = query(collection(db, collectionName), where("userId", "==", state.user.uid));
        const querySnapshot = await getDocs(q);
        const data = [];
        querySnapshot.forEach((docSnap) => {
          const docData = docSnap.data();
          data.push({ ...docData, id: docData.id || docSnap.id });
        });
        return data;
      } catch (e) {
        console.error('Erro ao carregar:', e);
        return [];
      }
    }

    async function deleteFromFirebase(collectionName, id) {
      try {
        await deleteDoc(doc(db, collectionName, String(id)));
        return true;
      } catch (e) {
        console.error('Erro ao deletar:', e);
        return false;
      }
    }

    async function loadAllData() {
      state.loading = true;
      render();
      
      try {
        const [insumos, receitas, produtos, clientes, vendas, movimentacoes, caixas, despesasRecorrentes] = await Promise.all([
          loadFromFirebase('insumos'),
          loadFromFirebase('receitas'),
          loadFromFirebase('produtos'),
          loadFromFirebase('clientes'),
          loadFromFirebase('vendas'),
          loadFromFirebase('movimentacoes'),
          loadFromFirebase('caixas'),
          loadFromFirebase('despesasRecorrentes')
        ]);

        state.insumos = insumos;
        state.receitas = receitas;
        state.produtos = produtos;
        state.clientes = clientes;
        state.vendas = vendas;
        state.movimentacoes = movimentacoes;
        state.caixas = caixas;
        state.despesasRecorrentes = despesasRecorrentes;
        
        // Verificar se há caixa aberto
        state.caixaAtual = caixas.find(c => c.status === 'aberto') || null;
        state.loading = false;
        
        render();
      } catch (e) {
        console.error('Erro ao carregar dados:', e);
        state.loading = false;
        render();
      }
    }


    function renderLoginScreen() {
      if (state.loginMode === 'login') {
        return `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
              <div class="text-center mb-8">
                <img src="icon-192.png" alt="Totaliz" class="w-24 h-24 mx-auto mb-4 rounded-2xl shadow-lg">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Totaliz</h1>
                <p class="text-gray-600">Sistema de Gestão</p>
              </div>
              <form id="login-form" class="space-y-4">
                <div>
                  <label class="block text-sm font-medium mb-2">Email</label>
                  <input type="email" id="email" required class="w-full border rounded px-4 py-2 focus:ring-2 focus:ring-blue-500" placeholder="seu@email.com">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-2">Senha</label>
                  <input type="password" id="password" required class="w-full border rounded px-4 py-2 focus:ring-2 focus:ring-blue-500" placeholder="••••••">
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded hover:bg-blue-600 font-medium">Entrar</button>
              </form>
              <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                  Não tem conta? 
                  <button data-action="toggle-mode" class="text-blue-500 hover:underline font-medium">Criar conta</button>
                </p>
              </div>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
              <div class="text-center mb-8">
                <img src="icon-192.png" alt="Totaliz" class="w-24 h-24 mx-auto mb-4 rounded-2xl shadow-lg">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Criar Conta</h1>
                <p class="text-gray-600">Cadastre-se gratuitamente</p>
              </div>
              <form id="register-form" class="space-y-4">
                <div>
                  <label class="block text-sm font-medium mb-2">Email</label>
                  <input type="email" id="reg-email" required class="w-full border rounded px-4 py-2 focus:ring-2 focus:ring-blue-500" placeholder="seu@email.com">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-2">Senha</label>
                  <input type="password" id="reg-password" required class="w-full border rounded px-4 py-2 focus:ring-2 focus:ring-blue-500" placeholder="Mínimo 6 caracteres">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-2">Confirmar Senha</label>
                  <input type="password" id="reg-confirm" required class="w-full border rounded px-4 py-2 focus:ring-2 focus:ring-blue-500" placeholder="Digite a senha novamente">
                </div>
                <button type="submit" class="w-full bg-green-500 text-white py-3 rounded hover:bg-green-600 font-medium">Criar Conta</button>
              </form>
              <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                  Já tem conta? 
                  <button data-action="toggle-mode" class="text-blue-500 hover:underline font-medium">Fazer login</button>
                </p>
              </div>
            </div>
          </div>
        `;
      }
    }

    function attachLoginListeners() {
      const loginForm = document.getElementById('login-form');
      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          handleLogin(email, password);
        });
      }

      const registerForm = document.getElementById('register-form');
      if (registerForm) {
        registerForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('reg-email').value;
          const password = document.getElementById('reg-password').value;
          const confirm = document.getElementById('reg-confirm').value;
          handleRegister(email, password, confirm);
        });
      }

      document.querySelectorAll('[data-action="toggle-mode"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.loginMode = state.loginMode === 'login' ? 'register' : 'login';
          render();
        });
      });
    }

    function render() {
      const root = document.getElementById('root');
      
      // Tela de Login
      if (state.showLoginScreen) {
        root.innerHTML = renderLoginScreen();
        attachLoginListeners();
        return;
      }
      
      if (state.loading) {
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
               <div class="text-6xl mb-4">⏳</div>>
              <p class="text-xl font-bold">Carregando dados da nuvem...</p>
              <p class="text-gray-600 mt-2">Aguarde um momento</p>
            </div>
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="min-h-screen p-4">
          <div class="max-w-7xl mx-auto">
            <div class="bg-gradient-to-r from-purple-600 via-pink-500 to-orange-500 text-white p-6 rounded-lg shadow-lg mb-6">
              <div class="flex justify-between items-center">
                <div>
                  <h1 class="text-3xl font-bold">Totaliz</h1>
                  <p class="text-blue-100">Gestão Inteligente de Produção</p>
                </div>
                <div class="text-right">
                  <p class="text-sm text-blue-100 mb-2">👤 ${state.user?.email || ''}</p>
                  <button data-action="logout" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded text-sm transition">
                    🚪 Sair
                  </button>
                </div>
              </div>
            </div>

            ${state.activeTab !== 'dashboard' ? `
              <div class="mb-4">
                <button data-action="voltar-dashboard" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 flex items-center gap-2">
                    ← Voltar ao Menu
                </button>
              </div>
            ` : ''}

            <div class="bg-white rounded-lg shadow p-6">
              ${renderContent()}
            </div>
          </div>
        </div>

        ${state.showModal ? renderModal() : ''}
      `;

      attachEventListeners();
      
      // Listeners para despesas recorrentes (setTimeout garante que elementos existam)
      setTimeout(() => {
        // Salvar despesa
        const btnSaveDespesa = document.querySelectorAll('[data-action="save-despesa-rec"]');
        btnSaveDespesa.forEach(btn => {
          btn.onclick = async () => {
            const nome = document.getElementById('nomeDespesaRec')?.value;
            const valor = parseFloat(document.getElementById('valorDespesaRec')?.value);
            const tipo = document.getElementById('tipoDespesaRec')?.value;
            const diaVencimento = parseInt(document.getElementById('diaVencimento')?.value);
            const categoria = document.getElementById('categoriaDespesaRec')?.value;
            
            if (!nome || !valor || !diaVencimento) {
              return alert('Preencha todos os campos');
            }
            
            const novaDespesa = {
              id: Date.now(),
              nome,
              valor,
              tipo,
              diaVencimento,
              categoria,
              dataInicio: new Date().toISOString()
            };
            
            if (tipo === 'parcelado') {
              novaDespesa.totalParcelas = parseInt(document.getElementById('totalParcelas')?.value) || 12;
            }
            
            await saveToFirebase('despesasRecorrentes', novaDespesa.id, novaDespesa);
            state.despesasRecorrentes.push(novaDespesa);
            
            state.showModal = false;
            render();
          };
        });
        
        // Toggle parcelas
        const tipoDespSelect = document.getElementById('tipoDespesaRec');
        if (tipoDespSelect) {
          tipoDespSelect.onchange = () => {
            const parcelasDiv = document.getElementById('parcelas-div');
            if (parcelasDiv) {
              parcelasDiv.style.display = tipoDespSelect.value === 'parcelado' ? 'block' : 'none';
            }
          };
        }
        
        // Pagar despesa
        const btnPagarDespesa = document.querySelectorAll('[data-action="pagar-despesa-rec"]');
        btnPagarDespesa.forEach(btn => {
          btn.onclick = async (e) => {
            const id = e.currentTarget.dataset.id;
            const valor = parseFloat(e.currentTarget.dataset.valor);
            const nome = e.currentTarget.dataset.nome;
            
            if (confirm(`Registrar pagamento de ${nome} - R$ ${valor.toFixed(2)}?`)) {
              const hoje = new Date();
              const mesAnoKey = `${hoje.getMonth()}-${hoje.getFullYear()}`;
              
              const mov = {
                id: Date.now(),
                tipo: 'saida',
                categoria: 'despesa-recorrente',
                despesaRecorrenteId: parseInt(id),
                mesAno: mesAnoKey,
                data: new Date().toISOString(),
                descricao: `Pagamento: ${nome}`,
                valor
              };
              
              await saveToFirebase('movimentacoes', mov.id, mov);
              state.movimentacoes.push(mov);
              
              alert('✅ Pagamento registrado!');
              render();
            }
          };
        });
        
        // Deletar despesa
        const btnDeleteDespesa = document.querySelectorAll('[data-action="delete-despesa-rec"]');
        btnDeleteDespesa.forEach(btn => {
          btn.onclick = async (e) => {
            if (confirm('Tem certeza que deseja excluir?')) {
              const id = e.currentTarget.dataset.id;
              await deleteFromFirebase('despesasRecorrentes', id);
              state.despesasRecorrentes = state.despesasRecorrentes.filter(d => d.id != id);
              render();
            }
          };
        });

        // ===== FLUXO DE CAIXA =====
        
        // Salvar sangria
        const btnSaveSangria = document.querySelectorAll('[data-action="save-sangria"]');
        btnSaveSangria.forEach(btn => {
          btn.onclick = async () => {
            const valor = parseFloat(document.getElementById('valorSangria')?.value);
            const motivo = document.getElementById('motivoSangria')?.value;
            
            if (!valor || !motivo) return alert('Preencha todos os campos');
            
            const mov = {
              id: Date.now(),
              tipo: 'saida',
              categoria: 'sangria',
              data: new Date().toISOString(),
              descricao: `Sangria: ${motivo}`,
              valor
            };
            
            await saveToFirebase('movimentacoes', mov.id, mov);
            state.movimentacoes.push(mov);
            
            state.showModal = false;
            render();
          };
        });
        
        // Salvar reforço
        const btnSaveReforco = document.querySelectorAll('[data-action="save-reforco"]');
        btnSaveReforco.forEach(btn => {
          btn.onclick = async () => {
            const valor = parseFloat(document.getElementById('valorReforco')?.value);
            const motivo = document.getElementById('motivoReforco')?.value;
            
            if (!valor || !motivo) return alert('Preencha todos os campos');
            
            const mov = {
              id: Date.now(),
              tipo: 'entrada',
              categoria: 'reforco',
              data: new Date().toISOString(),
              descricao: `Reforço: ${motivo}`,
              valor
            };
            
            await saveToFirebase('movimentacoes', mov.id, mov);
            state.movimentacoes.push(mov);
            
            state.showModal = false;
            render();
          };
        });
        
        // Salvar despesa do caixa
        const btnSaveDespesaCaixa = document.querySelectorAll('[data-action="save-despesa-caixa"]');
        btnSaveDespesaCaixa.forEach(btn => {
          btn.onclick = async () => {
            const valor = parseFloat(document.getElementById('valorDespesa')?.value);
            const descricao = document.getElementById('descricaoDespesa')?.value;
            const categoria = document.getElementById('categoriaDespesa')?.value;
            
            if (!valor || !descricao) return alert('Preencha todos os campos');
            
            const mov = {
              id: Date.now(),
              tipo: 'saida',
              categoria: categoria || 'despesa',
              data: new Date().toISOString(),
              descricao,
              valor
            };
            
            await saveToFirebase('movimentacoes', mov.id, mov);
            state.movimentacoes.push(mov);
            
            state.showModal = false;
            render();
          };
        });

        

        
        // Abrir caixa
        const btnAbrirCaixa = document.querySelectorAll('[data-action="save-abrir-caixa"]');
        btnAbrirCaixa.forEach(btn => {
          btn.onclick = async () => {
            const saldoInicial = parseFloat(document.getElementById('saldoInicial')?.value);
            
            if (isNaN(saldoInicial) || saldoInicial < 0) {
              return alert('Informe um saldo inicial válido');
            }
            
            const novoCaixa = {
              id: Date.now(),
              dataAbertura: new Date().toISOString(),
              saldoInicial: saldoInicial,
              status: 'aberto'
            };
            
            await saveToFirebase('caixas', novoCaixa.id, novoCaixa);
            state.caixas.push(novoCaixa);
            state.caixaAtual = novoCaixa;
            
            state.showModal = false;
            render();
          };
        });
        // Salvar fechar caixa
        const btnFecharCaixa = document.querySelectorAll('[data-action="save-fechar-caixa"]');
        btnFecharCaixa.forEach(btn => {
          btn.onclick = async () => {
            const saldoReal = parseFloat(document.getElementById('saldoReal')?.value);
            
            if (!state.caixaAtual) return alert('Nenhum caixa aberto');
            if (isNaN(saldoReal)) return alert('Informe o saldo real');
            
            state.caixaAtual.dataFechamento = new Date().toISOString();
            state.caixaAtual.saldoFinal = saldoReal;
            state.caixaAtual.status = 'fechado';
            
            await saveToFirebase('caixas', state.caixaAtual.id, state.caixaAtual);
            state.caixaAtual = null;
            
            alert('✅ Caixa fechado com sucesso!');
            state.showModal = false;
            render();
          };
        });

        
        // ===== LISTA DE COMPRAS - RISCAR ITENS =====
        
        // Listener para riscar itens marcados
        const checkboxesCompras = document.querySelectorAll('[data-insumo-check]');
        checkboxesCompras.forEach(checkbox => {
          checkbox.onchange = (e) => {
            const insumoId = e.target.dataset.insumoCheck;
            const itemDiv = document.getElementById(`item-compra-${insumoId}`);
            const itemContent = itemDiv?.querySelector('.item-content');
            
            if (itemContent) {
              if (e.target.checked) {
                // Riscar - adicionar classe
                itemContent.style.textDecoration = 'line-through';
                itemContent.style.opacity = '0.5';
                itemDiv.style.backgroundColor = '#f0fdf4'; // verde clarinho
              } else {
                // Desmarcar - remover riscado
                itemContent.style.textDecoration = 'none';
                itemContent.style.opacity = '1';
                itemDiv.style.backgroundColor = '#ffffff'; // branco
              }
            }
          };
        });
      }, 50);
    }

    function renderDespesasRecorrentes() {
      const hoje = new Date();
      const mesAtual = hoje.getMonth();
      const anoAtual = hoje.getFullYear();
      
      // Calcular despesas do mês
      const despesasMes = [];
      state.despesasRecorrentes.forEach(d => {
        if (d.tipo === 'mensal') {
          const vencimento = new Date(anoAtual, mesAtual, d.diaVencimento);
          despesasMes.push({...d, vencimento, parcela: null});
        } else if (d.tipo === 'parcelado') {
          const dataInicio = new Date(d.dataInicio);
          const mesesDesdeInicio = (anoAtual - dataInicio.getFullYear()) * 12 + (mesAtual - dataInicio.getMonth());
          
          if (mesesDesdeInicio >= 0 && mesesDesdeInicio < d.totalParcelas) {
            const vencimento = new Date(anoAtual, mesAtual, d.diaVencimento);
            despesasMes.push({...d, vencimento, parcela: mesesDesdeInicio + 1});
          }
        }
      });
      
      despesasMes.sort((a, b) => a.vencimento - b.vencimento);
      
      const mesAnoKey = `${mesAtual}-${anoAtual}`;
      despesasMes.forEach(d => {
        const pagamento = state.movimentacoes.find(m => 
          m.categoria === 'despesa-recorrente' && 
          m.despesaRecorrenteId == d.id &&
          m.mesAno === mesAnoKey
        );
        d.paga = !!pagamento;
      });
      
      const vencidas = despesasMes.filter(d => !d.paga && d.vencimento.getTime() < hoje.getTime()).length;
      const aVencer = despesasMes.filter(d => !d.paga && d.vencimento.getTime() >= hoje.getTime()).length;
      
      return `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold">📅 Despesas Recorrentes</h2>
          <button data-action="modal" data-modal="nova-despesa-recorrente" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            ➕ Nova Despesa
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-red-50 border border-red-200 p-4 rounded-lg">
            <p class="text-sm text-red-700">Vencidas</p>
            <p class="text-3xl font-bold text-red-800">${vencidas}</p>
          </div>
          <div class="bg-yellow-50 border border-yellow-200 p-4 rounded-lg">
            <p class="text-sm text-yellow-700">A Vencer</p>
            <p class="text-3xl font-bold text-yellow-800">${aVencer}</p>
          </div>
          <div class="bg-green-50 border border-green-200 p-4 rounded-lg">
            <p class="text-sm text-green-700">Total Mensal</p>
            <p class="text-3xl font-bold text-green-800">R$ ${despesasMes.reduce((t, d) => t + d.valor, 0).toFixed(2)}</p>
          </div>
        </div>

        <h3 class="text-lg font-bold mb-3">Despesas de ${['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][mesAtual]}/${anoAtual}</h3>
        
        ${despesasMes.length > 0 ? `
          <div class="space-y-2">
            ${despesasMes.map(d => {
              const vencida = !d.paga && d.vencimento < hoje;
              const bgColor = d.paga ? 'bg-green-50 border-green-200' : vencida ? 'bg-red-50 border-red-200' : 'bg-white border-gray-200';
              
              return `
                <div class="border ${bgColor} rounded-lg p-4">
                  <div class="flex justify-between items-start">
                    <div class="flex-1">
                      <div class="flex items-center gap-2 mb-1">
                        <p class="font-bold">${d.nome}</p>
                        ${d.parcela ? `<span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded">Parcela ${d.parcela}/${d.totalParcelas}</span>` : ''}
                        ${d.paga ? '<span class="text-xs bg-green-500 text-white px-2 py-1 rounded">✓ PAGA</span>' : ''}
                        ${vencida ? '<span class="text-xs bg-red-500 text-white px-2 py-1 rounded">⚠️ VENCIDA</span>' : ''}
                      </div>
                      <p class="text-sm text-gray-600">Vencimento: ${d.vencimento.toLocaleDateString('pt-BR')}</p>
                      <p class="text-sm text-gray-600">Categoria: ${d.categoria}</p>
                    </div>
                    <div class="text-right">
                      <p class="text-xl font-bold text-red-600">R$ ${d.valor.toFixed(2)}</p>
                      <div class="flex gap-2 mt-2">
                        ${!d.paga ? `<button data-action="pagar-despesa-rec" data-id="${d.id}" data-valor="${d.valor}" data-nome="${d.nome}" class="text-green-500 hover:text-green-600 text-sm">💰 Pagar</button>` : ''}
                        <button data-action="delete-despesa-rec" data-id="${d.id}" class="text-red-500 hover:text-red-600 text-sm">🗑️</button>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : '<div class="text-center py-8 text-gray-500"><p>Nenhuma despesa neste mês</p></div>'}

        <div class="mt-6">
          <h3 class="text-lg font-bold mb-3">Todas as Despesas Cadastradas</h3>
          ${state.despesasRecorrentes.length > 0 ? `
            <div class="grid gap-3">
              ${state.despesasRecorrentes.map(d => `
                <div class="border rounded-lg p-4 bg-white">
                  <div class="flex justify-between items-start">
                    <div>
                      <p class="font-bold">${d.nome}</p>
                      <p class="text-sm text-gray-600">
                        ${d.tipo === 'mensal' ? `Todo dia ${d.diaVencimento}` : `Parcelado em ${d.totalParcelas}x - Dia ${d.diaVencimento}`}
                      </p>
                      <p class="text-sm text-gray-600">Categoria: ${d.categoria}</p>
                    </div>
                    <div class="text-right">
                      <p class="text-lg font-bold">R$ ${d.valor.toFixed(2)}</p>
                      <button data-action="delete-despesa-rec" data-id="${d.id}" class="text-red-500 hover:text-red-600 mt-2">🗑️</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="text-center py-8 text-gray-500">
              <p>Nenhuma despesa cadastrada</p>
              <button data-action="modal" data-modal="nova-despesa-recorrente" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Cadastrar Primeira Despesa
              </button>
            </div>
          `}
        </div>
      `;
    }

    function renderRelatorios() {
      // Calcular produtos mais vendidos
      const produtosVendidos = {};
      state.vendas.forEach(v => {
        v.itens.forEach(it => {
          if (!produtosVendidos[it.produtoId]) {
            produtosVendidos[it.produtoId] = {quantidade: 0, valor: 0};
          }
          produtosVendidos[it.produtoId].quantidade += it.quantidade;
          produtosVendidos[it.produtoId].valor += it.quantidade * it.precoUnitario;
        });
      });

      const rankingProdutos = Object.entries(produtosVendidos)
        .map(([id, data]) => {
          const prod = state.produtos.find(p => p.id == id);
          return {nome: prod?.nome || 'Produto', ...data};
        })
        .sort((a, b) => b.quantidade - a.quantidade)
        .slice(0, 5);

      // Clientes que mais compram
      const clientesCompras = {};
      state.vendas.forEach(v => {
        if (!clientesCompras[v.clienteId]) {
          clientesCompras[v.clienteId] = {total: 0, qtdCompras: 0};
        }
        clientesCompras[v.clienteId].total += v.valorFinal;
        clientesCompras[v.clienteId].qtdCompras++;
      });

      const rankingClientes = Object.entries(clientesCompras)
        .map(([id, data]) => {
          const cli = state.clientes.find(c => c.id == id);
          return {nome: cli?.nome || 'Cliente', ...data};
        })
        .sort((a, b) => b.total - a.total)
        .slice(0, 5);

      // Vendas por forma de pagamento
      const porPagamento = {};
      state.vendas.forEach(v => {
        if (!porPagamento[v.formaPagamento]) {
          porPagamento[v.formaPagamento] = 0;
        }
        porPagamento[v.formaPagamento] += v.valorFinal;
      });

      // Total de vendas e lucro
      const totalVendas = state.vendas.reduce((t, v) => t + v.valorFinal, 0);
      let lucroTotal = 0;
      state.vendas.forEach(v => {
        v.itens.forEach(it => {
          const prod = state.produtos.find(p => p.id == it.produtoId);
          if (prod) {
            lucroTotal += (prod.precoVenda - prod.custoUnitario) * it.quantidade;
          }
        });
      });

      return `
        <h2 class="text-2xl font-bold mb-4">📊 Relatórios</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg">
            <p class="text-sm text-blue-700">Total de Vendas</p>
            <p class="text-2xl font-bold text-blue-800">R$ ${totalVendas.toFixed(2)}</p>
            <p class="text-xs text-blue-600">${state.vendas.length} vendas realizadas</p>
          </div>
          <div class="bg-green-50 border border-green-200 p-4 rounded-lg">
            <p class="text-sm text-green-700">Lucro Total</p>
            <p class="text-2xl font-bold text-green-800">R$ ${lucroTotal.toFixed(2)}</p>
            <p class="text-xs text-green-600">Margem: ${totalVendas > 0 ? ((lucroTotal/totalVendas)*100).toFixed(1) : 0}%</p>
          </div>
          <div class="bg-purple-50 border border-purple-200 p-4 rounded-lg">
            <p class="text-sm text-purple-700">Ticket Médio</p>
            <p class="text-2xl font-bold text-purple-800">R$ ${state.vendas.length > 0 ? (totalVendas/state.vendas.length).toFixed(2) : '0.00'}</p>
            <p class="text-xs text-purple-600">Por venda</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="border rounded-lg p-4">
             <h3 class="font-bold mb-3 text-orange-700">🏆 Produtos Mais Vendidos</h3>
            ${rankingProdutos.length > 0 ? `
              <div class="space-y-2">
                ${rankingProdutos.map((p, i) => `
                  <div class="flex justify-between items-center border-b pb-2">
                    <div>
                      <p class="font-medium">${i+1}. ${p.nome}</p>
                      <p class="text-xs text-gray-500">${p.quantidade} unidades</p>
                    </div>
                    <p class="font-bold text-orange-600">R$ ${p.valor.toFixed(2)}</p>
                  </div>
                `).join('')}
              </div>
            ` : '<p class="text-sm text-gray-500">Nenhuma venda registrada</p>'}
          </div>

          <div class="border rounded-lg p-4">
            <h3 class="font-bold mb-3 text-blue-700">👥 Melhores Clientes</h3>
            ${rankingClientes.length > 0 ? `
              <div class="space-y-2">
                ${rankingClientes.map((c, i) => `
                  <div class="flex justify-between items-center border-b pb-2">
                    <div>

                      <p class="text-xs text-gray-500">${c.qtdCompras} compras</p>

              </div>
            ` : '<p class="text-sm text-gray-500">Nenhuma venda registrada</p>'}
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">

            ${Object.keys(porPagamento).length > 0 ? `
              <div class="space-y-2">
                ${Object.entries(porPagamento).map(([forma, valor]) => `
                  <div class="flex justify-between items-center border-b pb-2">

                    <p class="font-bold text-green-600">R$ ${valor.toFixed(2)}</p>
                  </div>
                `).join('')}
              </div>
            ` : '<p class="text-sm text-gray-500">Nenhuma venda registrada</p>'}
          </div>

          <div class="border rounded-lg p-4">
           <h3 class="font-bold mb-3 text-purple-700">💰 Custo dos Produtos</h3>
            ${state.produtos.length > 0 ? `
              <div class="space-y-2">
                ${state.produtos.map(p => {
                  const lucro = p.precoVenda - p.custoUnitario;
                  const margem = ((lucro / p.precoVenda) * 100).toFixed(1);
                  return `

                      <div class="flex justify-between text-xs text-gray-600 mt-1">
                        <span>Custo: R$ ${p.custoUnitario.toFixed(2)}</span>
                        <span>Venda: R$ ${p.precoVenda.toFixed(2)}</span>
                        <span class="font-medium ${margem > 30 ? 'text-green-600' : margem > 15 ? 'text-orange-600' : 'text-red-600'}">${margem}%</span>

                return `

                    <p class="font-bold text-lg mb-2">${p.nome}</p>

                      ${receita.ingredientes.map(ing => {
                        const insumo = state.insumos.find(i => i.id == ing.insumoId);
                        if (!insumo) return '';
                        const custoIng = ing.quantidade * insumo.precoMedio;
