    async function handleLogin(email, password) {
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        if (error.code === 'auth/invalid-credential') {
          alert('Email ou senha incorretos!');
        } else {
          alert('Erro ao fazer login: ' + error.message);
        }
      }
    }

    async function handleRegister(email, password, confirmPassword) {
      if (password !== confirmPassword) return alert('As senhas não coincidem!');
      if (password.length < 6) return alert('A senha deve ter pelo menos 6 caracteres!');
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert('✅ Conta criada com sucesso! Faça login.');
        state.loginMode = 'login';
        render();
      } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
          alert('Este email já está cadastrado!');
        } else {
          alert('Erro ao criar conta: ' + error.message);
        }
      }
    }
    
    async function handleActivation(code, email, password, confirmPassword) {
      // Normalizar código (uppercase, remover espaços)
      code = code.trim().toUpperCase();
      
      // Validações
      if (!code || code.length < 9) {
        return alert('❌ Código inválido! Deve ter o formato: ABC-123-XYZ');
      }
      
      if (!email || !email.includes('@')) {
        return alert('❌ Email inválido!');
      }
      
      if (password !== confirmPassword) {
        return alert('❌ As senhas não coincidem!');
      }
      
      if (password.length < 6) {
        return alert('❌ A senha deve ter pelo menos 6 caracteres!');
      }
      
      try {
        console.log('🔍 Procurando código:', code);
        
        // Verificar se código existe e é válido
        const codigosRef = collection(db, 'codigosAtivacao');
        const q = query(codigosRef, where("codigo", "==", code));
        const querySnapshot = await getDocs(q);
        
        console.log('📋 Códigos encontrados:', querySnapshot.size);
        
        if (querySnapshot.empty) {
          // Tentar buscar sem o where para ver se tem algum código
          const allCodigosSnapshot = await getDocs(codigosRef);
          console.log('📦 Total de códigos no banco:', allCodigosSnapshot.size);
          
          if (allCodigosSnapshot.size > 0) {
            console.log('Primeiros 3 códigos no banco:');
            allCodigosSnapshot.docs.slice(0, 3).forEach(doc => {
              console.log('  -', doc.data().codigo);
            });
          }
          
          return alert('❌ Código não encontrado!\n\nVerifique:\n• Se digitou corretamente (ABC-123-XYZ)\n• Maiúsculas e minúsculas\n• Se não há espaços extras');
        }
        
        const codigoDoc = querySnapshot.docs[0];
        const codigoData = codigoDoc.data();
        
        console.log('✅ Código encontrado:', codigoData);
        
        // Verificar se já foi usado
        if (codigoData.usado) {
          return alert('❌ Este código já foi utilizado!');
        }
        
        // Verificar validade (30 dias)
        const criadoEm = new Date(codigoData.criadoEm);
        const hoje = new Date();
        const diasPassados = Math.floor((hoje - criadoEm) / (1000 * 60 * 60 * 24));
        
        if (diasPassados > 30) {
          return alert('❌ Este código expirou! Entre em contato com o suporte.');
        }
        
        // Criar conta no Firebase Auth
        await createUserWithEmailAndPassword(auth, email, password);
        
        // Criar doc de configurações para o novo usuário (nome vazio pra ele definir)
        const newUser = getAuth().currentUser;
        if (newUser) {
          await setDoc(doc(db, 'configuracoes', newUser.uid), {
            userId: newUser.uid,
            nomeEmpresa: '',
            assinaturaPaga: false,
            contaBloqueada: false,
            stripeCustomerId: codigoData.stripeCustomerId || null,
            atualizadoEm: new Date().toISOString()
          });
        }
        
        // Marcar código como usado
        await setDoc(doc(db, 'codigosAtivacao', codigoDoc.id), {
          ...codigoData,
          usado: true,
          usadoEm: new Date().toISOString(),
          emailAtivado: email
        });
        
        alert('🎉 Conta ativada com sucesso! Você já pode fazer login.');
        state.loginMode = 'login';
        render();
        
      } catch (error) {
        console.error('Erro na ativação:', error);
        
        if (error.code === 'auth/email-already-in-use') {
          alert('❌ Este email já está cadastrado! Use outro email ou faça login.');
        } else if (error.code === 'auth/invalid-email') {
          alert('❌ Email inválido!');
        } else if (error.code === 'auth/weak-password') {
          alert('❌ Senha muito fraca! Use no mínimo 6 caracteres.');
        } else {
          alert('❌ Erro ao ativar conta: ' + error.message);
        }
      }
    }

    // ===== SISTEMA DE TRIAL PERIOD =====
    async function checkTrialPeriod() {
      try {
        const q = query(collection(db, 'userSettings'), where("userId", "==", state.user.uid));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
          // Primeira vez do usuário - criar registro de trial
          const trialStart = new Date().toISOString();
          const settingsId = Date.now();
          await setDoc(doc(db, 'userSettings', String(settingsId)), {
            userId: state.user.uid,
            trialStartDate: trialStart,
            id: settingsId
          });
          state.trialStartDate = trialStart;
        } else {
          // Carregar data de início do trial existente
          querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            state.trialStartDate = data.trialStartDate;
          });
        }
        
        // Calcular se deve mostrar banner
        const daysRemaining = getTrialDaysRemaining();
        // Só mostra banner se NÃO tiver assinatura paga
        state.showTrialBanner = !state.assinaturaPaga && daysRemaining !== null && daysRemaining >= 0;
        
        console.log('🔍 Debug Trial:', {
          assinaturaPaga: state.assinaturaPaga,
          daysRemaining,
          showTrialBanner: state.showTrialBanner
        });

        // Bloqueio automático quando trial acabou e não tem assinatura
        if (!state.assinaturaPaga && daysRemaining !== null && daysRemaining < 0 && !state.contaBloqueada) {
          state.contaBloqueada = true;
          await setDoc(doc(db, 'configuracoes', state.user.uid), {
            userId: state.user.uid,
            nomeEmpresa: state.nomeEmpresa,
            assinaturaPaga: false,
            contaBloqueada: true,
            atualizadoEm: new Date().toISOString()
          });
          console.log('🔒 Conta bloqueada automaticamente — trial acabou!');
        }

        // Bloquear conta automaticamente se trial acabou e não pagou
        if (!state.assinaturaPaga && daysRemaining !== null && daysRemaining < 0 && !state.contaBloqueada) {
          state.contaBloqueada = true;
          await setDoc(doc(db, 'configuracoes', state.user.uid), {
            userId: state.user.uid,
            nomeEmpresa: state.nomeEmpresa,
            assinaturaPaga: false,
            contaBloqueada: true,
            atualizadoEm: new Date().toISOString()
          });
          console.log('🔒 Conta bloqueada automaticamente — trial acabou.');
        }
      } catch (e) {
        console.error('Erro ao verificar trial:', e);
      }
    }

    function getTrialDaysRemaining() {
      if (!state.trialStartDate) return null;
      
      const startDate = new Date(state.trialStartDate);
      const today = new Date();
      const diffTime = today - startDate;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const remaining = 30 - diffDays;
      
      return remaining;
    }

    async function handleLogout() {
      if (confirm('Deseja realmente sair?')) {
        await signOut(auth);
        state.insumos = [];
        state.receitas = [];
        state.produtos = [];
        state.clientes = [];
        state.vendas = [];
        state.movimentacoes = [];
      }
    }

    async function saveToFirebase(collectionName, id, data) {
      try {
        const dataWithUser = { ...data, userId: state.user.uid };
        await setDoc(doc(db, collectionName, String(id)), dataWithUser);
        return true;
      } catch (e) {
        console.error('Erro ao salvar:', e);
        console.error('Collection:', collectionName, 'ID:', id);
        console.error('Erro completo:', e.message, e.code);
        alert(`Erro ao salvar dados em ${collectionName}. ${e.message || 'Tente novamente.'}`);
        return false;
      }
    }

    async function loadFromFirebase(collectionName) {
      try {
        const q = query(collection(db, collectionName), where("userId", "==", state.user.uid));
        const querySnapshot = await getDocs(q);
        const data = [];
        querySnapshot.forEach((docSnap) => {
          const docData = docSnap.data();
          data.push({ ...docData, id: docData.id || docSnap.id });
        });
        return data;
      } catch (e) {
        console.error('Erro ao carregar:', e);
        return [];
      }
    }

    async function deleteFromFirebase(collectionName, id) {
      try {
        await deleteDoc(doc(db, collectionName, String(id)));
        return true;
      } catch (e) {
        console.error('Erro ao deletar:', e);
        return false;
      }
    }

    // ============================================
    // CONVERSÃO DE UNIDADES
    // ============================================
    // Tabela base completa (usado como fallback se state ainda não carregou)
    const TABELA_UNIDADES_BASE = [
      { unidade: 'g',   grupo: 'Massa',       fator: 1,       ativo: true },
      { unidade: 'kg',  grupo: 'Massa',       fator: 1000,    ativo: true },
      { unidade: 'mg',  grupo: 'Massa',       fator: 0.001,   ativo: false },
      { unidade: 'oz',  grupo: 'Massa',       fator: 28.3495, ativo: false },
      { unidade: 'lb',  grupo: 'Massa',       fator: 453.592, ativo: false },
      { unidade: 'ml',  grupo: 'Volume',      fator: 1,       ativo: true },
      { unidade: 'L',   grupo: 'Volume',      fator: 1000,    ativo: true },
      { unidade: 'cl',  grupo: 'Volume',      fator: 10,      ativo: false },
      { unidade: 'cm',  grupo: 'Comprimento', fator: 1,       ativo: false },
      { unidade: 'm',   grupo: 'Comprimento', fator: 100,     ativo: false },
      { unidade: 'mm',  grupo: 'Comprimento', fator: 0.1,     ativo: false },
      { unidade: 'pol', grupo: 'Comprimento', fator: 2.54,    ativo: false },
      { unidade: 'un',  grupo: 'Capacidade',  fator: 1,       ativo: true },
      { unidade: 'cx',  grupo: 'Capacidade',  fator: 1,       ativo: false },
      { unidade: 'dz',  grupo: 'Capacidade',  fator: 12,      ativo: false },
      { unidade: 'pcs', grupo: 'Capacidade',  fator: 1,       ativo: false },
    ];

    function getTabelaAtual() {
      return (state.unidadesMedida && state.unidadesMedida.length) ? state.unidadesMedida : TABELA_UNIDADES_BASE;
    }

    function getGrupo(unidade) {
      const tabela = getTabelaAtual();
      const item = tabela.find(u => u.unidade === unidade);
      if (item) return { grupo: item.grupo, fator: item.fator };
      return { grupo: unidade, fator: 1 };
    }

    function converterUnidade(quantidade, de, para) {
      if (de === para) return quantidade;
      const origem = getGrupo(de);
      const destino = getGrupo(para);
      if (origem.grupo !== destino.grupo) return null;
      return quantidade * (origem.fator / destino.fator);
    }

    function unidadesCompativeis(u1, u2) {
      if (u1 === u2) return true;
      return getGrupo(u1).grupo === getGrupo(u2).grupo;
    }

    // Retorna apenas as unidades ativas pra usar nos selects
    function getUnidadesAtivas() {
      return getTabelaAtual().filter(u => u.ativo).map(u => u.unidade);
    }

    async function loadAllData() {
      state.loading = true;
      render();
      
      try {
        const [insumos, receitas, produtos, clientes, vendas, movimentacoes, caixas, despesasRecorrentes, inventario] = await Promise.all([
          loadFromFirebase('insumos'),
          loadFromFirebase('receitas'),
          loadFromFirebase('produtos'),
          loadFromFirebase('clientes'),
          loadFromFirebase('vendas'),
          loadFromFirebase('movimentacoes'),
          loadFromFirebase('caixas'),
          loadFromFirebase('despesasRecorrentes'),
          loadFromFirebase('inventario')
        ]);

        state.insumos = insumos;
        state.receitas = receitas;
        state.produtos = produtos;
        state.clientes = clientes;
        state.vendas = vendas;
        state.movimentacoes = movimentacoes;
        state.caixas = caixas;
        state.despesasRecorrentes = despesasRecorrentes;
        state.inventario = inventario;
        
        // Verificar se há caixa aberto
        state.caixaAtual = caixas.find(c => c.status === 'aberto') || null;
        
        // Carregar configurações PRIMEIRO (assinaturaPaga, contaBloqueada, etc)
        await loadConfiguracoes();
        
        // DEPOIS verificar trial (já sabe se é pago ou não)
        await checkTrialPeriod();
        
        // Carregar notificações
        await loadNotificacoes();
        
        state.loading = false;
        
        render();
      } catch (e) {
        console.error('Erro ao carregar dados:', e);
        state.loading = false;
        render();
      }
    }
    
    // ===== SISTEMA DE NOTIFICAÇÕES =====
    async function loadNotificacoes() {
      try {
        const notifSnapshot = await getDocs(
          query(
            collection(db, 'notificacoes'),
            where('ativo', '==', true)
          )
        );
        
        const notificacoes = notifSnapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        })).sort((a, b) => new Date(b.criadoEm) - new Date(a.criadoEm));
        
        state.notificacoesApp = notificacoes;
        
        // Contar não lidas
        const notifLidasDoc = await getDoc(doc(db, 'notificacoesLidas', state.user.uid));
        const lidas = notifLidasDoc.exists() ? notifLidasDoc.data().lidas || [] : [];
        
        state.notificacoesNaoLidas = notificacoes.filter(n => !lidas.includes(n.id)).length;
        
      } catch (e) {
        console.error('Erro ao carregar notificações:', e);
      }
    }
    
    async function marcarNotificacaoComoLida(notifId) {
      try {
        const notifLidasRef = doc(db, 'notificacoesLidas', state.user.uid);
        const notifLidasDoc = await getDoc(notifLidasRef);
        
        let lidas = [];
        if (notifLidasDoc.exists()) {
          lidas = notifLidasDoc.data().lidas || [];
        }
        
        if (!lidas.includes(notifId)) {
          lidas.push(notifId);
          await setDoc(notifLidasRef, { lidas, userId: state.user.uid });
          state.notificacoesNaoLidas = Math.max(0, state.notificacoesNaoLidas - 1);
          render();
        }
      } catch (e) {
        console.error('Erro ao marcar notificação:', e);
      }
    }
    
    async function enviarNotificacaoGlobal(titulo, mensagem, tipo) {
      try {
        const novaNotif = {

    // ===== FUNÇÕES ADMIN =====
    
    async function loadAllUsers() {
      if (!state.isAdmin) return;
      
      try {
        // Carregar todas as configurações
        const configsSnapshot = await getDocs(collection(db, 'configuracoes'));
        const users = [];
        
        for (const doc of configsSnapshot.docs) {
          const config = doc.data();
          
          // Carregar userSettings para pegar trial
          const settingsSnapshot = await getDocs(
            query(collection(db, 'userSettings'), where("userId", "==", config.userId))
          );
          
          let diasRestantes = null;
          if (!settingsSnapshot.empty) {
            const settings = settingsSnapshot.docs[0].data();
            if (settings.trialStartDate) {
              const startDate = new Date(settings.trialStartDate);
              const today = new Date();
              const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
              diasRestantes = 30 - diffDays;
            }
          }
          
          users.push({
            userId: config.userId,
            email: config.userId, // Firebase usa UID, precisaria buscar o email
            nomeEmpresa: config.nomeEmpresa || 'Não configurado',
            assinaturaPaga: config.assinaturaPaga || false,
            contaBloqueada: config.contaBloqueada || false,
            diasRestantes
          });
        }
        
        state.todosUsuarios = users;
        render();
        
      } catch (e) {
        console.error('Erro ao carregar usuários:', e);
        alert('❌ Erro ao carregar lista de clientes');
      }
    }
    
    async function adminToggleAssinatura(userId, currentStatus) {
      if (!state.isAdmin) return;
      
      const novoStatus = !currentStatus;
      const confirmMsg = novoStatus 
        ? '✅ Marcar como PAGANTE?' 
        : '⏳ Marcar como TRIAL?';
      
      if (!confirm(confirmMsg)) return;
      
      try {
        const configRef = doc(db, 'configuracoes', userId);
        
        // Usar setDoc com merge - funciona sempre!
        await setDoc(configRef, {
          userId: userId,
          assinaturaPaga: novoStatus,
          atualizadoEm: new Date().toISOString()
        }, { merge: true });
        
        alert('✅ Status atualizado!');
        await loadAllUsers();
        
      } catch (e) {
        console.error('Erro:', e);
        alert('❌ Erro ao atualizar: ' + e.message);
      }
    }
    
    async function adminToggleBloqueio(userId, currentStatus) {

      const novoStatus = !currentStatus;
      const confirmMsg = novoStatus 
        ? '🔒 BLOQUEAR esta conta?' 
        : '🔓 DESBLOQUEAR esta conta?';
      
      if (!confirm(confirmMsg)) return;

    }
    
    // ===== GERADOR DE CÓDIGOS =====
    async function gerarCodigos(quantidade) {
      if (!state.isAdmin) return;
      
      try {
        const codigos = [];
        
        for (let i = 0; i < quantidade; i++) {
          // Gerar código no formato ABC-123-XYZ
          const parte1 = gerarLetrasAleatorias(3);
          const parte2 = gerarNumerosAleatorios(3);
          const parte3 = gerarLetrasAleatorias(3);
          const codigo = `${parte1}-${parte2}-${parte3}`;
          
          // Salvar no Firebase
          const codigoId = Date.now() + i;
          await setDoc(doc(db, 'codigosAtivacao', String(codigoId)), {
            codigo: codigo,
            usado: false,
            criadoEm: new Date().toISOString()
          });
          
          codigos.push(codigo);
        }
        
        state.codigosGerados = codigos;
        return codigos;
        
      } catch (e) {
        console.error('Erro ao gerar códigos:', e);
        throw e;
      }
    }
    
    function gerarLetrasAleatorias(tamanho) {
      const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let resultado = '';
      for (let i = 0; i < tamanho; i++) {
        resultado += letras.charAt(Math.floor(Math.random() * letras.length));
      }
      return resultado;
    }
    
    function gerarNumerosAleatorios(tamanho) {
      let resultado = '';
      for (let i = 0; i < tamanho; i++) {
        resultado += Math.floor(Math.random() * 10);
      }
      return resultado;
    }
    
    function copiarCodigos() {
      const texto = state.codigosGerados.join('\n');
      navigator.clipboard.writeText(texto).then(() => {
        alert('✅ Códigos copiados para área de transferência!');
      }).catch(() => {
        alert('❌ Erro ao copiar. Copie manualmente.');
      });
    }

    // ===== CARREGAR CONFIGURAÇÕES =====
    async function loadConfiguracoes() {
      try {
        const configDoc = await getDoc(doc(db, 'configuracoes', state.user.uid));
        if (configDoc.exists()) {
          const config = configDoc.data();
          state.nomeEmpresa = config.nomeEmpresa || '';
          state.assinaturaPaga = config.assinaturaPaga || false;
          state.contaBloqueada = config.contaBloqueada || false;
          state.unidadesMedida = config.unidadesMedida && Array.isArray(config.unidadesMedida)
            ? TABELA_UNIDADES_BASE.map(base => {
                const salva = config.unidadesMedida.find(u => u.unidade === base.unidade);
                return salva ? { ...base, ativo: salva.ativo } : base;
              })
            : TABELA_UNIDADES_BASE;
          
          // Carregar preferências de notificações (padrão: todas ativas)
          state.notificacoes = config.notificacoes || {
            estoqueBaixo: true,
            trialAcabando: true,
            resumoDiario: true,
            clienteDevedor: true
          };

          // Se nome da empresa ainda não foi definido, força ir pra configurações
          if (!state.nomeEmpresa) {
            state.nomeEmpresa = 'Minha Empresa';
            state.activeTab = 'configuracoes';
          }
        }
      } catch (e) {
        console.log('Nenhuma configuração salva ainda');
      }
    }

    // ===== SALVAR CONFIGURAÇÕES =====
    async function salvarConfiguracoes(nomeEmpresa, assinaturaPaga, contaBloqueada) {
      try {
        // Ler estado dos checkboxes de unidades
        const unidadesMedida = state.unidadesMedida.map(u => {
          const cb = document.querySelector(`.unidade-checkbox[data-unidade="${u.unidade}"]`);
          return { ...u, ativo: cb ? cb.checked : u.ativo };
        });
        
        // Ler estado dos checkboxes de notificações
        const notificacoes = {
          estoqueBaixo: document.getElementById('notif-estoque-baixo')?.checked ?? true,
          trialAcabando: document.getElementById('notif-trial-acabando')?.checked ?? true,
          resumoDiario: document.getElementById('notif-resumo-diario')?.checked ?? true,
          clienteDevedor: document.getElementById('notif-cliente-devedor')?.checked ?? true
        };

        await setDoc(doc(db, 'configuracoes', state.user.uid), {
          userId: state.user.uid,
          nomeEmpresa: nomeEmpresa || state.nomeEmpresa,
          assinaturaPaga: assinaturaPaga !== undefined ? assinaturaPaga : state.assinaturaPaga,
          contaBloqueada: contaBloqueada !== undefined ? contaBloqueada : state.contaBloqueada,
          unidadesMedida: unidadesMedida,
          notificacoes: notificacoes,
          atualizadoEm: new Date().toISOString()
        });
        if (nomeEmpresa) state.nomeEmpresa = nomeEmpresa;
        if (assinaturaPaga !== undefined) state.assinaturaPaga = assinaturaPaga;
        if (contaBloqueada !== undefined) state.contaBloqueada = contaBloqueada;
        state.unidadesMedida = unidadesMedida;
        state.notificacoes = notificacoes;
        console.log('✅ Configurações salvas!');
        return true;
      } catch (e) {
        console.error('Erro ao salvar configurações:', e);
        return false;
      }
    }

    function attachLoginListeners() {
      const loginForm = document.getElementById('login-form');
      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          handleLogin(email, password);
        });
      }

      const activateForm = document.getElementById('activate-form');
      if (activateForm) {
        activateForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const code = document.getElementById('activation-code').value.trim().toUpperCase();
          const email = document.getElementById('activate-email').value.trim();
          const password = document.getElementById('activate-password').value;
          const confirm = document.getElementById('activate-confirm').value;
          await handleActivation(code, email, password, confirm);
        });
        
        // Formatar código automaticamente (adicionar hífens)
        const codeInput = document.getElementById('activation-code');
        if (codeInput) {
          codeInput.addEventListener('input', (e) => {
            let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (value.length > 3 && value.length <= 6) {
              value = value.slice(0, 3) + '-' + value.slice(3);
            } else if (value.length > 6) {
              value = value.slice(0, 3) + '-' + value.slice(3, 6) + '-' + value.slice(6, 9);
            }
            e.target.value = value;
          });
        }
      }

      document.querySelectorAll('[data-action="toggle-mode"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.loginMode = 'login';
          render();
        });
      });
      
      document.querySelectorAll('[data-action="toggle-activate"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.loginMode = 'activate';
          render();
        });
      });
      
      // Esqueci minha senha
      const forgotPasswordBtn = document.getElementById('forgot-password-btn');
      if (forgotPasswordBtn) {
        forgotPasswordBtn.addEventListener('click', async () => {
          const email = prompt('Digite seu email para receber o link de redefinição de senha:');
          if (!email) return;
          
          try {
            await sendPasswordResetEmail(auth, email);
            alert('✅ Email enviado! Verifique sua caixa de entrada.');
          } catch (error) {
            console.error('Erro ao enviar email:', error);
            if (error.code === 'auth/user-not-found') {
              alert('❌ Email não encontrado.');
            } else {
              alert('❌ Erro ao enviar email. Tente novamente.');
            }
          }
        });
      }
    }

            state.movimentacoes.push(mov);
            
            state.showModal = false;
            render();
          };
        });
        
        // Salvar reforço
        const btnSaveReforco = document.querySelectorAll('[data-action="save-reforco"]');
        btnSaveReforco.forEach(btn => {
          btn.onclick = async () => {
            const valor = parseFloat(document.getElementById('valorReforco')?.value);

              descricao: `Reforço: ${motivo}`,

            state.showModal = false;
            render();

        // Salvar despesa do caixa

            const valor = parseFloat(document.getElementById('valorDespesa')?.value);
            const descricao = document.getElementById('descricaoDespesa')?.value;
            const categoria = document.getElementById('categoriaDespesa')?.value;
            
            if (!valor || !descricao) return alert('Preencha todos os campos');
            
            const mov = {
              id: Date.now(),
              tipo: 'saida',
              categoria: categoria || 'despesa',
              data: new Date().toISOString(),
              descricao,
              valor
            };
            
            await saveToFirebase('movimentacoes', mov.id, mov);
            state.movimentacoes.push(mov);
            
            state.showModal = false;
            render();
          };
        });

        

        
        // Abrir caixa
        const btnAbrirCaixa = document.querySelectorAll('[data-action="save-abrir-caixa"]');
        btnAbrirCaixa.forEach(btn => {
          btn.onclick = async () => {
            const saldoInicial = parseFloat(document.getElementById('saldoInicial')?.value);
            
            if (isNaN(saldoInicial) || saldoInicial < 0) {
              return alert('Informe um saldo inicial válido');
            }
            
            const novoCaixa = {
              id: Date.now(),
              dataAbertura: new Date().toISOString(),
              saldoInicial: saldoInicial,
              status: 'aberto'
            };
            
            await saveToFirebase('caixas', novoCaixa.id, novoCaixa);
            state.caixas.push(novoCaixa);
            state.caixaAtual = novoCaixa;
            
            state.showModal = false;
            render();
          };
        });
        // Salvar fechar caixa
        const btnFecharCaixa = document.querySelectorAll('[data-action="save-fechar-caixa"]');
        btnFecharCaixa.forEach(btn => {
          btn.onclick = async () => {
            const saldoReal = parseFloat(document.getElementById('saldoReal')?.value);
            
            if (!state.caixaAtual) return alert('Nenhum caixa aberto');
            if (isNaN(saldoReal)) return alert('Informe o saldo real');
            
            state.caixaAtual.dataFechamento = new Date().toISOString();
            state.caixaAtual.saldoFinal = saldoReal;
            state.caixaAtual.status = 'fechado';
            
            await saveToFirebase('caixas', state.caixaAtual.id, state.caixaAtual);
            state.caixaAtual = null;
            
            alert('✅ Caixa fechado com sucesso!');
            state.showModal = false;
            render();
          };
        });

        
        // ===== LISTA DE COMPRAS - RISCAR ITENS =====
        
        // Listener para riscar itens marcados
        const checkboxesCompras = document.querySelectorAll('[data-insumo-check]');
        checkboxesCompras.forEach(checkbox => {
          checkbox.onchange = (e) => {
            const insumoId = e.target.dataset.insumoCheck;
            const itemDiv = document.getElementById(`item-compra-${insumoId}`);
            const itemContent = itemDiv?.querySelector('.item-content');
            
            if (itemContent) {
              if (e.target.checked) {
                // Riscar - adicionar classe
                itemContent.style.textDecoration = 'line-through';
                itemContent.style.opacity = '0.5';
                itemDiv.style.backgroundColor = '#f0fdf4'; // verde clarinho
              } else {
                // Desmarcar - remover riscado
                itemContent.style.textDecoration = 'none';
                itemContent.style.opacity = '1';
                itemDiv.style.backgroundColor = '#ffffff'; // branco
              }
            }
          };
        });
        
        // ===== ADICIONAR PRODUTO DIRETO =====
        
        // Toggle preço de venda
        const tipoProdutoDireto = document.getElementById('tipoProdutoDireto');
        if (tipoProdutoDireto) {
          tipoProdutoDireto.onchange = (e) => {
            const precoContainer = document.getElementById('precoVendaDiretoContainer');
            if (precoContainer) {
              if (e.target.value === 'intermediario') {
                precoContainer.style.display = 'none';
              } else {
                precoContainer.style.display = 'block';
              }
            }
          };
        }
        
        // Salvar produto direto
        document.querySelectorAll('[data-action="save-produto-direto"]').forEach(btn => {
          btn.onclick = async () => {
            const nome = document.getElementById('nomeProdutoDireto')?.value;
            const tipo = document.getElementById('tipoProdutoDireto')?.value;
            const quantidade = parseFloat(document.getElementById('quantidadeProdutoDireto')?.value);
            const custo = parseFloat(document.getElementById('custoProdutoDireto')?.value);
            const precoVendaInput = document.getElementById('precoVendaDireto');
            const precoVenda = tipo === 'final' ? parseFloat(precoVendaInput?.value) : custo;
            
            if (!nome || !quantidade || !custo) {
              return alert('Preencha todos os campos obrigatórios!');
            }
            
            if (tipo === 'final' && !precoVenda) {
              return alert('Preencha o preço de venda!');
            }
            
            const ehIntermediario = tipo === 'intermediario';
            
            const novoProduto = {
              id: Date.now(),
              receitaId: null,
              nome: nome,
              quantidade: quantidade,
              custoUnitario: custo,
              precoVenda: precoVenda,
              unidade: document.getElementById('unidadeProdutoDireto')?.value || 'un',
              estoqueMinimo: parseFloat(document.getElementById('estoqueMinimoProdutoDireto')?.value) || 5,
              ehIntermediario: ehIntermediario
            };
            
            await saveToFirebase('produtos', novoProduto.id, novoProduto);
            state.produtos.push(novoProduto);
            
            state.showModal = false;
            render();
            
            alert(`✅ Produto "${nome}" adicionado com sucesso!`);
          };
        });
      }, 50);
    }

    function renderCaixa() {
      const hoje = new Date().toDateString();
      const movHoje = state.movimentacoes.filter(m => new Date(m.data).toDateString() === hoje);
      
      if (!state.caixaAtual) {
        return `
          <div class="text-center py-12">

            <button data-action="modal" data-modal="abrir-caixa" class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 font-medium">
              Abrir Caixa
            </button>
            
            ${state.caixas.length > 0 ? `
              <div class="mt-8">
                <h3 class="text-lg font-bold mb-4">Histórico de Caixas</h3>
                <div class="grid gap-3 max-w-2xl mx-auto">
                  ${state.caixas.slice().reverse().slice(0, 5).map(c => `
                    <div class="border rounded-lg p-4 text-left">
                      <div class="flex justify-between items-center">
                        <div>
                          <p class="font-medium">${new Date(c.dataAbertura).toLocaleDateString('pt-BR')}</p>
                          <p class="text-sm text-gray-600">Abertura: R$ ${c.saldoInicial.toFixed(2)}</p>
                        </div>
                        <div class="text-right">
                          <p class="text-sm text-gray-600">Fechamento:</p>
                          <p class="font-bold ${c.saldoFinal >= c.saldoInicial ? 'text-green-600' : 'text-red-600'}">R$ ${c.saldoFinal.toFixed(2)}</p>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      const entradas = movHoje.filter(m => m.tipo === 'entrada').reduce((t, m) => t + m.valor, 0);
      const saidas = movHoje.filter(m => m.tipo === 'saida').reduce((t, m) => t + m.valor, 0);
      const saldoAtual = state.caixaAtual.saldoInicial + entradas - saidas;

      return `
        <div class="mb-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold">💰 Fluxo de Caixa</h2>
            <button data-action="modal" data-modal="fechar-caixa" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
              Fechar Caixa
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg">
              <p class="text-sm text-blue-700">Saldo Inicial</p>
              <p class="text-2xl font-bold text-blue-800">R$ ${state.caixaAtual.saldoInicial.toFixed(2)}</p>
            </div>

    function renderDespesasRecorrentes() {
      const hoje = new Date();
      const mesAtual = hoje.getMonth();
      const anoAtual = hoje.getFullYear();
      
      // Calcular despesas do mês
      const despesasMes = [];
      state.despesasRecorrentes.forEach(d => {
        if (d.tipo === 'mensal') {
          const vencimento = new Date(anoAtual, mesAtual, d.diaVencimento);
          despesasMes.push({...d, vencimento, parcela: null});
        } else if (d.tipo === 'parcelado') {
          const dataInicio = new Date(d.dataInicio);
          const mesesDesdeInicio = (anoAtual - dataInicio.getFullYear()) * 12 + (mesAtual - dataInicio.getMonth());
          
          if (mesesDesdeInicio >= 0 && mesesDesdeInicio < d.totalParcelas) {
            const vencimento = new Date(anoAtual, mesAtual, d.diaVencimento);
            despesasMes.push({...d, vencimento, parcela: mesesDesdeInicio + 1});
          }
        }
      });
      
      despesasMes.sort((a, b) => a.vencimento - b.vencimento);
      
      const mesAnoKey = `${mesAtual}-${anoAtual}`;
      despesasMes.forEach(d => {
        const pagamento = state.movimentacoes.find(m => 
          m.categoria === 'despesa-recorrente' && 
          m.despesaRecorrenteId == d.id &&
          m.mesAno === mesAnoKey
        );
        d.paga = !!pagamento;
      });
      
      const vencidas = despesasMes.filter(d => !d.paga && d.vencimento.getTime() < hoje.getTime()).length;
      const aVencer = despesasMes.filter(d => !d.paga && d.vencimento.getTime() >= hoje.getTime()).length;
      
      return `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold">📅 Despesas Recorrentes</h2>
          <button data-action="modal" data-modal="nova-despesa-recorrente" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            ➕ Nova Despesa
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-red-50 border border-red-200 p-4 rounded-lg">
            <p class="text-sm text-red-700">Vencidas</p>
            <p class="text-3xl font-bold text-red-800">${vencidas}</p>
          </div>
          <div class="bg-yellow-50 border border-yellow-200 p-4 rounded-lg">
            <p class="text-sm text-yellow-700">A Vencer</p>
            <p class="text-3xl font-bold text-yellow-800">${aVencer}</p>
          </div>
          <div class="bg-green-50 border border-green-200 p-4 rounded-lg">
            <p class="text-sm text-green-700">Total Mensal (fixo)</p>
            <p class="text-3xl font-bold text-green-800">R$ ${despesasMes.filter(d => !d.valorVariavel).reduce((t, d) => t + d.valor, 0).toFixed(2)}</p>
            <p class="text-xs text-green-600 mt-1">+ despesas variáveis</p>
          </div>
        </div>

        <h3 class="text-lg font-bold mb-3">Despesas de ${['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][mesAtual]}/${anoAtual}</h3>
        
        ${despesasMes.length > 0 ? `
          <div class="space-y-2">
            ${despesasMes.map(d => {
              const vencida = !d.paga && d.vencimento < hoje;
              const bgColor = d.paga ? 'bg-green-50 border-green-200' : vencida ? 'bg-red-50 border-red-200' : 'bg-white border-gray-200';
              
              return `
                <div class="border ${bgColor} rounded-lg p-4">
                  <div class="flex justify-between items-start">
                    <div class="flex-1">
                      <div class="flex items-center gap-2 mb-1">
                        <p class="font-bold">${d.nome}</p>
                        ${d.parcela ? `<span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded">Parcela ${d.parcela}/${d.totalParcelas}</span>` : ''}
                        ${d.paga ? '<span class="text-xs bg-green-500 text-white px-2 py-1 rounded">✓ PAGA</span>' : ''}
                        ${vencida ? '<span class="text-xs bg-red-500 text-white px-2 py-1 rounded">⚠️ VENCIDA</span>' : ''}
                      </div>
                      <p class="text-sm text-gray-600">Vencimento: ${d.vencimento.toLocaleDateString('pt-BR')}</p>
                      <p class="text-sm text-gray-600">Categoria: ${d.categoria}</p>
                    </div>
                    <div class="text-right">
                      <p class="text-xl font-bold text-red-600">${d.valorVariavel ? 'Variável' : 'R$ ' + d.valor.toFixed(2)}</p>
                      <div class="flex gap-2 mt-2">
                        ${!d.paga ? `<button data-action="pagar-despesa-rec" data-id="${d.id}" data-variavel="${d.valorVariavel || false}" data-valor="${d.valor || 0}" data-nome="${d.nome}" class="text-green-500 hover:text-green-600 text-sm font-bold">💰 Pagar</button>` : ''}
                        <button data-action="delete-despesa-rec" data-id="${d.id}" class="text-red-500 hover:text-red-600 text-sm">🗑️</button>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : '<div class="text-center py-8 text-gray-500"><p>Nenhuma despesa neste mês</p></div>'}

        <div class="mt-6">
          <h3 class="text-lg font-bold mb-3">Todas as Despesas Cadastradas</h3>
          ${state.despesasRecorrentes.length > 0 ? `
            <div class="grid gap-3">
              ${state.despesasRecorrentes.map(d => `
                <div class="border rounded-lg p-4 bg-white">
                  <div class="flex justify-between items-start">
                    <div>
                      <p class="font-bold">${d.nome}</p>
                      <p class="text-sm text-gray-600">
                        ${d.tipo === 'mensal' ? `Todo dia ${d.diaVencimento}` : `Parcelado em ${d.totalParcelas}x - Dia ${d.diaVencimento}`}
                      </p>
                      <p class="text-sm text-gray-600">Categoria: ${d.categoria}</p>
                    </div>
                    <div class="text-right">
                      <p class="text-lg font-bold">${d.valorVariavel ? '<span class="text-blue-600">📊 Variável</span>' : 'R$ ' + d.valor.toFixed(2)}</p>
                      <button data-action="delete-despesa-rec" data-id="${d.id}" class="text-red-500 hover:text-red-600 mt-2">🗑️</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="text-center py-8 text-gray-500">
              <p>Nenhuma despesa cadastrada</p>
              <button data-action="modal" data-modal="nova-despesa-recorrente" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Cadastrar Primeira Despesa
              </button>
            </div>
          `}
        </div>
      `;
    }

    function renderRelatorios() {
      // Calcular produtos mais vendidos
      const produtosVendidos = {};
      state.vendas.forEach(v => {
        v.itens.forEach(it => {
          if (!produtosVendidos[it.produtoId]) {
            produtosVendidos[it.produtoId] = {quantidade: 0, valor: 0};
          }
          produtosVendidos[it.produtoId].quantidade += it.quantidade;
          produtosVendidos[it.produtoId].valor += it.quantidade * it.precoUnitario;
        });
      });

      const rankingProdutos = Object.entries(produtosVendidos)
        .map(([id, data]) => {
          const prod = state.produtos.find(p => p.id == id);
          return {nome: prod?.nome || 'Produto', ...data};
        })
        .sort((a, b) => b.quantidade - a.quantidade)
        .slice(0, 5);

      // Clientes que mais compram
      const clientesCompras = {};
      state.vendas.forEach(v => {
        if (!clientesCompras[v.clienteId]) {
          clientesCompras[v.clienteId] = {total: 0, qtdCompras: 0};
        }
        clientesCompras[v.clienteId].total += v.valorFinal;
        clientesCompras[v.clienteId].qtdCompras++;
      });

      const rankingClientes = Object.entries(clientesCompras)
        .map(([id, data]) => {
          const cli = state.clientes.find(c => c.id == id);
          return {nome: cli?.nome || 'Cliente', ...data};
        })
        .sort((a, b) => b.total - a.total)
        .slice(0, 5);

      // Vendas por forma de pagamento
      const porPagamento = {};
      state.vendas.forEach(v => {
        if (!porPagamento[v.formaPagamento]) {
          porPagamento[v.formaPagamento] = 0;
        }
        porPagamento[v.formaPagamento] += v.valorFinal;
      });

      // Total de vendas e lucro
      const totalVendas = state.vendas.reduce((t, v) => t + v.valorFinal, 0);
      let lucroTotal = 0;
      state.vendas.forEach(v => {
        v.itens.forEach(it => {
          const prod = state.produtos.find(p => p.id == it.produtoId);
          if (prod) {
            lucroTotal += (prod.precoVenda - prod.custoUnitario) * it.quantidade;
          }
        });
      });

      return `
        <h2 class="text-2xl font-bold mb-4">📊 Relatórios</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg">
            <p class="text-sm text-blue-700">Total de Vendas</p>
            <p class="text-2xl font-bold text-blue-800">R$ ${totalVendas.toFixed(2)}</p>
            <p class="text-xs text-blue-600">${state.vendas.length} vendas realizadas</p>
          </div>
          <div class="bg-green-50 border border-green-200 p-4 rounded-lg">
            <p class="text-sm text-green-700">Lucro Total</p>
            <p class="text-2xl font-bold text-green-800">R$ ${lucroTotal.toFixed(2)}</p>
            <p class="text-xs text-green-600">Margem: ${totalVendas > 0 ? ((lucroTotal/totalVendas)*100).toFixed(1) : 0}%</p>
          </div>
          <div class="bg-purple-50 border border-purple-200 p-4 rounded-lg">
            <p class="text-sm text-purple-700">Ticket Médio</p>
            <p class="text-2xl font-bold text-purple-800">R$ ${state.vendas.length > 0 ? (totalVendas/state.vendas.length).toFixed(2) : '0.00'}</p>
            <p class="text-xs text-purple-600">Por venda</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="border rounded-lg p-4">
             <h3 class="font-bold mb-3 text-orange-700">🏆 Produtos Mais Vendidos</h3>
            ${rankingProdutos.length > 0 ? `
              <div class="space-y-2">
                ${rankingProdutos.map((p, i) => `
                  <div class="flex justify-between items-center border-b pb-2">
                    <div>
                      <p class="font-medium">${i+1}. ${p.nome}</p>
                      <p class="text-xs text-gray-500">${p.quantidade} unidades</p>
                    </div>
                    <p class="font-bold text-orange-600">R$ ${p.valor.toFixed(2)}</p>
                  </div>
                `).join('')}
              </div>
            ` : '<p class="text-sm text-gray-500">Nenhuma venda registrada</p>'}
          </div>

          <div class="border rounded-lg p-4">
            <h3 class="font-bold mb-3 text-blue-700">👥 Melhores Clientes</h3>
            ${rankingClientes.length > 0 ? `
              <div class="space-y-2">
                ${rankingClientes.map((c, i) => `
                  <div class="flex justify-between items-center border-b pb-2">
                    <div>
                      <p class="font-medium">${i+1}. ${c.nome}</p>
                      <p class="text-xs text-gray-500">${c.qtdCompras} compras</p>
                    </div>
                    <p class="font-bold text-blue-600">R$ ${c.total.toFixed(2)}</p>
                  </div>
                `).join('')}
              </div>
            ` : '<p class="text-sm text-gray-500">Nenhuma venda registrada</p>'}
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="border rounded-lg p-4">
           <h3 class="font-bold mb-3 text-green-700">💳 Vendas por Pagamento</h3>
            ${Object.keys(porPagamento).length > 0 ? `
              <div class="space-y-2">
                ${Object.entries(porPagamento).map(([forma, valor]) => `
                  <div class="flex justify-between items-center border-b pb-2">
                    <p class="font-medium capitalize">${forma}</p>
                    <p class="font-bold text-green-600">R$ ${valor.toFixed(2)}</p>
                  </div>
                `).join('')}
              </div>
            ` : '<p class="text-sm text-gray-500">Nenhuma venda registrada</p>'}
          </div>

          <div class="border rounded-lg p-4">
           <h3 class="font-bold mb-3 text-purple-700">💰 Custo dos Produtos</h3>
            ${state.produtos.length > 0 ? `
              <div class="space-y-2">
                ${state.produtos.map(p => {
                  const lucro = p.precoVenda - p.custoUnitario;
                  const margem = ((lucro / p.precoVenda) * 100).toFixed(1);
                  return `
                    <div class="border-b pb-2">
                      <div class="flex justify-between items-center">
                        <p class="font-medium">${p.nome}</p>
                        <p class="text-sm font-bold ${lucro > 0 ? 'text-green-600' : 'text-red-600'}">+R$ ${lucro.toFixed(2)}</p>
                      </div>
                      <div class="flex justify-between text-xs text-gray-600 mt-1">
                        <span>Custo: R$ ${p.custoUnitario.toFixed(2)}</span>
                        <span>Venda: R$ ${p.precoVenda.toFixed(2)}</span>
                        <span class="font-medium ${margem > 30 ? 'text-green-600' : margem > 15 ? 'text-orange-600' : 'text-red-600'}">${margem}%</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : '<p class="text-sm text-gray-500">Nenhum produto cadastrado</p>'}
          </div>
        </div>

        <div class="border rounded-lg p-4">
          <<h3 class="font-bold mb-3 text-red-700">📦 Detalhamento de Custos</h3>
          ${state.produtos.length > 0 ? `
            <div class="space-y-4">
              ${state.produtos.map(p => {
                const receita = state.receitas.find(r => r.id == p.receitaId);
                if (!receita) return '';
                return `
                  <div class="bg-gray-50 p-3 rounded">
                    <p class="font-bold text-lg mb-2">${p.nome}</p>
                    <div class="text-sm">
                      <p class="font-medium mb-1">Ingredientes:</p>
                      ${receita.ingredientes.map(ing => {
                        const insumo = state.insumos.find(i => i.id == ing.insumoId);
                        if (!insumo) return '';
                        const custoIng = ing.quantidade * insumo.precoMedio;
                        return `
                          <div class="flex justify-between py-1 border-b">
                            <span>${insumo.nome} - ${ing.quantidade} ${insumo.unidade}</span>
                            <span class="font-medium">R$ ${custoIng.toFixed(2)}</span>
                          </div>
                        `;
                      }).join('')}
                      <div class="flex justify-between pt-2 font-bold">
                        <span>CUSTO TOTAL:</span>
                        <span class="text-red-600">R$ ${p.custoUnitario.toFixed(2)}</span>
                      </div>
                      <div class="flex justify-between text-green-700">
                        <span>Preço de Venda:</span>
                        <span class="font-bold">R$ ${p.precoVenda.toFixed(2)}</span>
                      </div>
                      <div class="flex justify-between text-blue-700 font-bold">
                        <span>Lucro por Unidade:</span>
                        <span>R$ ${(p.precoVenda - p.custoUnitario).toFixed(2)}</span>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : '<p class="text-sm text-gray-500">Nenhum produto cadastrado</p>'}
        </div>
      `;
    }

    function renderInventario() {

      const inventarioPorCategoria = {};
      categorias.forEach(cat => {
        inventarioPorCategoria[cat] = state.inventario.filter(i => i.categoria === cat);
      });
      
      const totalValor = state.inventario.reduce((total, item) => total + (item.valorCompra || 0), 0);
      
      return `
        <div class="bg-white rounded-lg shadow p-6">
          <div class="flex justify-between items-center mb-6">
            <div>
              <h2 class="text-3xl font-bold">🏭 Inventário / Patrimônio</h2>

          <!-- Resumo -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-gradient-to-br from-teal-500 to-teal-600 text-white p-4 rounded-lg">

              <p class="text-sm opacity-90">Valor Total</p>
              <p class="text-3xl font-bold">R$ ${totalValor.toFixed(2)}</p>
            </div>
            <div class="bg-gradient-to-br from-orange-500 to-orange-600 text-white p-4 rounded-lg">
              <p class="text-sm opacity-90">Necessitam Manutenção</p>
              <p class="text-3xl font-bold">${state.inventario.filter(i => i.estado === 'Necessita Manutenção').length}</p>

          </div>
          
          ${state.inventario.length === 0 ? `
            <div class="text-center py-20">
              <div class="text-6xl mb-4">📦</div>
              <p class="text-gray-500 text-lg">Nenhum item cadastrado ainda</p>
              <p class="text-gray-400 text-sm mt-2">Clique em "+ Novo Item" para começar</p>
            </div>

            ${categorias.map(categoria => {
              const itens = inventarioPorCategoria[categoria];
              if (itens.length === 0) return '';
              
              return `
                <div class="mb-6">
                  <h3 class="text-lg font-bold mb-3 text-gray-700">${categoria}s (${itens.length})</h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${itens.map(item => {
                      const estadoCor = {
                        'Novo': 'bg-green-100 text-green-800',
                        'Bom': 'bg-blue-100 text-blue-800',
                        'Regular': 'bg-yellow-100 text-yellow-800',
                        'Necessita Manutenção': 'bg-orange-100 text-orange-800',
                        'Quebrado': 'bg-red-100 text-red-800'

                      return `

                              </button>

                          <div class="space-y-1 text-sm">

                            <p><span class="text-gray-500">Valor:</span> R$ ${(item.valorCompra || 0).toFixed(2)}</p>
                            ${item.fornecedor ? `<p><span class="text-gray-500">Fornecedor:</span> ${item.fornecedor}</p>` : ''}
                            ${item.observacoes ? `<p class="text-gray-400 italic text-xs mt-2">${item.observacoes}</p>` : ''}
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          `}
        </div>
      `;
    }

              valorCompra,
