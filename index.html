      // Sistema de receitas
      let ingredientesReceita = [];

      function setupReceitaModal() {
        const receita = state.editingId ? state.receitas.find(r => r.id == state.editingId) : null;
        ingredientesReceita = receita ? JSON.parse(JSON.stringify(receita.ingredientes)) : [];
        variacoesReceita = receita && receita.variacoes ? JSON.parse(JSON.stringify(receita.variacoes)) : [];
        
        renderIngredientesReceita();
        renderVariacoesReceita();

        document.querySelectorAll('[data-action="add-ingrediente"]').forEach(btn => {
          btn.onclick = () => {
            ingredientesReceita.push({insumoId: '', quantidade: '', tipo: 'fixo', unidade: ''});
            renderIngredientesReceita();
          };
        });
        
        document.querySelectorAll('[data-action="add-produto-gerado"]').forEach(btn => {
          btn.onclick = () => {
            variacoesReceita.push({nome: '', extras: []});
            renderVariacoesReceita();
          };
        });

        document.querySelectorAll('[data-action="save-receita"]').forEach(btn => {
          btn.onclick = async () => {
            const nome = document.getElementById('nomeReceita').value;
            if (!nome || ingredientesReceita.length === 0) return alert('Preencha nome e ingredientes da base');

            const custo = ingredientesReceita.reduce((t, ing) => {
              const ins = state.insumos.find(i => i.id == ing.insumoId);
              if (!ins || !ing.quantidade) return t;
              const unidadeIng = ing.unidade || ins.unidade;
              const qtdConvertida = converterUnidade(parseFloat(ing.quantidade), unidadeIng, ins.unidade);
              if (qtdConvertida === null) return t;
              return t + (qtdConvertida * ins.precoMedio);
            }, 0);

            if (state.editingId) {
              const receita = state.receitas.find(r => r.id == state.editingId);
              if (receita) {
                receita.nome = nome;
                receita.ingredientes = ingredientesReceita.map(i => ({
                  insumoId: parseInt(i.insumoId),
                  quantidade: parseFloat(i.quantidade),
                  unidade: i.unidade || '',
                  tipo: i.tipo
                }));
                receita.variacoes = variacoesReceita.map(v => ({
                  nome: v.nome,
                  extras: (v.extras || []).map(e => ({
                    insumoId: parseInt(e.insumoId),
                    qtdPorUnidade: parseFloat(e.qtdPorUnidade),
                    unidade: e.unidade
                  }))
                }));
                receita.custoTotal = custo;
                await saveToFirebase('receitas', receita.id, receita);
              }
            } else {
              const novaReceita = {
                id: Date.now(),
                nome,
                ingredientes: ingredientesReceita.map(i => ({
                  insumoId: parseInt(i.insumoId),
                  quantidade: parseFloat(i.quantidade),
                  unidade: i.unidade || '',
                  tipo: i.tipo
                })),
                variacoes: variacoesReceita.map(v => ({
                  nome: v.nome,
                  extras: (v.extras || []).map(e => ({
                    insumoId: parseInt(e.insumoId),
                    qtdPorUnidade: parseFloat(e.qtdPorUnidade),
                    unidade: e.unidade
                  }))
                })),
                custoTotal: custo,
                userId: state.user.uid
              };
              await saveToFirebase('receitas', novaReceita.id, novaReceita);
              state.receitas.push(novaReceita);
            }

            ingredientesReceita = [];
            variacoesReceita = [];
            state.showModal = false;
            state.editingId = null;
            render();
          };
        });
      }

      function renderIngredientesReceita() {
        const list = document.getElementById('ingredientes-list');
        if (!list) return;

        const insumosOrdenados = [...state.insumos].sort((a, b) => a.nome.localeCompare(b.nome));

        list.innerHTML = ingredientesReceita.map((ing, i) => {
          const insumo = state.insumos.find(x => x.id == ing.insumoId);
          const unidadeInsumo = insumo?.unidade || '';
          const unidadeAtual = ing.unidade || unidadeInsumo;
          const compativel = insumo ? unidadesCompativeis(unidadeAtual, unidadeInsumo) : true;

          return `
          <div class="flex gap-2 items-center ${!compativel ? 'bg-red-50 border border-red-200 rounded p-1' : ''}">
            <select class="flex-1 border rounded px-2 py-1 text-sm" data-ing-field="insumoId" data-ing-index="${i}">
              <option value="">Selecione...</option>
              ${[...state.insumos].sort((a,b) => a.nome.localeCompare(b.nome)).map(ins => `<option value="${ins.id}" ${ing.insumoId == ins.id ? 'selected' : ''}>${ins.nome} (${ins.unidade})</option>`).join('')}
            </select>
            <input type="number" step="0.01" placeholder="Qtd" class="w-20 border rounded px-2 py-1 text-sm" data-ing-field="quantidade" data-ing-index="${i}" value="${ing.quantidade}">
            <select class="w-16 border rounded px-1 py-1 text-sm ${!compativel ? 'border-red-500' : ''}" data-ing-field="unidade" data-ing-index="${i}">
              ${getUnidadesAtivas().map(val => `<option value="${val}" ${unidadeAtual === val ? 'selected' : ''}>${val}</option>`).join('')}
            </select>
            <select class="w-24 border rounded px-2 py-1 text-sm" data-ing-field="tipo" data-ing-index="${i}">
              <option value="fixo" ${ing.tipo === 'fixo' ? 'selected' : ''}>Fixo</option>
              <option value="por_unidade" ${ing.tipo === 'por_unidade' ? 'selected' : ''}>Por unid.</option>
            </select>
            <button type="button" data-action="remove-ing" data-ing-index="${i}" class="text-red-500 hover:text-red-600 px-2">🗑️</button>
          </div>
          ${!compativel ? `<p class="text-xs text-red-600 col-span-full">⚠️ Unidade incompatível com o insumo (${unidadeInsumo})</p>` : ''}
        `;
        }).join('');

        list.querySelectorAll('[data-ing-field]').forEach(el => {
          el.addEventListener('change', (e) => {
            const idx = parseInt(e.target.dataset.ingIndex);
            const field = e.target.dataset.ingField;
            ingredientesReceita[idx][field] = e.target.value;
            // Se mudou o insumo, atualiza a unidade automaticamente
            if (field === 'insumoId') {
              const ins = state.insumos.find(x => x.id == e.target.value);
              if (ins) ingredientesReceita[idx].unidade = ins.unidade;
            }
            renderIngredientesReceita();
          });
        });

        list.querySelectorAll('[data-action="remove-ing"]').forEach(el => {
          el.addEventListener('click', (e) => {
            const idx = parseInt(e.target.dataset.ingIndex);
            ingredientesReceita.splice(idx, 1);
            renderIngredientesReceita();
          });
        });
      }

      // ===== VARIAÇÕES DA RECEITA =====
      let variacoesReceita = [];
      
      function renderVariacoesReceita() {
        const list = document.getElementById('produtos-gerados-list');
        if (!list) return;

        if (variacoesReceita.length === 0) {
          list.innerHTML = `
            <div class="text-center py-4 bg-gray-50 rounded border border-dashed border-gray-300">
              <p class="text-sm text-gray-500">Nenhuma variação adicionada</p>
              <p class="text-xs text-gray-400 mt-1">Clique em "+ Adicionar Produto" abaixo</p>
            </div>
          `;
          return;
        }

        list.innerHTML = variacoesReceita.map((variacao, varIdx) => `
          <div class="border border-green-200 rounded-lg p-3 bg-green-50 space-y-2">
            <div class="flex gap-2 items-center">
              <input 
                type="text" 
                placeholder="Nome da variação (ex: Doce de Leite com Creme)"
                class="flex-1 border rounded px-2 py-1 text-sm font-medium"
                data-var-field="nome"
                data-var-index="${varIdx}"
                value="${variacao.nome || ''}"
              >
              <button 
                type="button" 
                data-action="remove-variacao" 
                data-var-index="${varIdx}" 
                class="text-red-500 hover:text-red-700 px-2"
              >
                🗑️
              </button>
            </div>
            
            <div class="pl-4 border-l-2 border-green-300 space-y-2">
              <p class="text-xs font-medium text-gray-600">Ingredientes Extras (por unidade):</p>
              <div id="extras-list-${varIdx}" class="space-y-1"></div>
              <button 
                type="button" 
                data-action="add-extra" 
                data-var-index="${varIdx}"
                class="text-xs text-blue-600 hover:text-blue-700"
              >
                + Adicionar ingrediente extra
              </button>
            </div>
          </div>
        `).join('');

        // Renderizar ingredientes extras de cada variação
        variacoesReceita.forEach((variacao, varIdx) => {
          renderExtrasVariacao(varIdx);
        });

        // Event listeners para nome da variação
        list.querySelectorAll('[data-var-field]').forEach(el => {
          el.addEventListener('change', (e) => {
            const idx = parseInt(e.target.dataset.varIndex);
            const field = e.target.dataset.varField;
            variacoesReceita[idx][field] = e.target.value;
          });
        });

        // Event listeners para remover variação
        list.querySelectorAll('[data-action="remove-variacao"]').forEach(el => {
          el.addEventListener('click', (e) => {
            const idx = parseInt(e.target.dataset.varIndex);
            variacoesReceita.splice(idx, 1);
            renderVariacoesReceita();
          });
        });

        // Event listeners para adicionar extra
        list.querySelectorAll('[data-action="add-extra"]').forEach(el => {
          el.addEventListener('click', (e) => {
            const varIdx = parseInt(e.target.dataset.varIndex);
            if (!variacoesReceita[varIdx].extras) variacoesReceita[varIdx].extras = [];
            variacoesReceita[varIdx].extras.push({
              insumoId: '',
              qtdPorUnidade: 0,
              unidade: ''
            });
            renderExtrasVariacao(varIdx);
          });
        });
      }

      function renderExtrasVariacao(varIdx) {
        const container = document.getElementById(`extras-list-${varIdx}`);
        if (!container) return;

        const variacao = variacoesReceita[varIdx];
        const extras = variacao.extras || [];

        if (extras.length === 0) {
          container.innerHTML = `<p class="text-xs text-gray-400 italic">Nenhum ingrediente extra</p>`;
          return;
        }

        container.innerHTML = extras.map((extra, extraIdx) => {
          const insumo = state.insumos.find(x => x.id == extra.insumoId);
          const unidadeInsumo = insumo?.unidade || '';
          const unidadeAtual = extra.unidade || unidadeInsumo;
          const compativel = insumo ? unidadesCompativeis(unidadeAtual, unidadeInsumo) : true;

          return `
            <div class="flex gap-1 items-center text-xs ${!compativel ? 'bg-red-50 border border-red-200 rounded p-1' : ''}">
              <select 
                class="flex-1 border rounded px-1 py-1 text-xs"
                data-extra-field="insumoId"
                data-var-index="${varIdx}"
                data-extra-index="${extraIdx}"
              >
                <option value="">Insumo...</option>
                ${state.insumos.map(ins => `
                  <option value="${ins.id}" ${extra.insumoId == ins.id ? 'selected' : ''}>
                    ${ins.nome} (${ins.unidade})
                  </option>
                `).join('')}
              </select>
              <input 
                type="number" 
                step="0.01" 
                placeholder="Qtd/un"
                class="w-16 border rounded px-1 py-1 text-xs"
                data-extra-field="qtdPorUnidade"
                data-var-index="${varIdx}"
                data-extra-index="${extraIdx}"
                value="${extra.qtdPorUnidade || ''}"
              >
              <select 
                class="w-12 border rounded px-1 py-1 text-xs ${!compativel ? 'border-red-500' : ''}"
                data-extra-field="unidade"
                data-var-index="${varIdx}"
                data-extra-index="${extraIdx}"
              >
                ${getUnidadesAtivas().map(val => `
                  <option value="${val}" ${unidadeAtual === val ? 'selected' : ''}>${val}</option>
                `).join('')}
              </select>
              <button 
                type="button"
                data-action="remove-extra"
                data-var-index="${varIdx}"
                data-extra-index="${extraIdx}"
                class="text-red-500 hover:text-red-700 px-1"
              >
                ×
              </button>
            </div>
            ${!compativel ? `<p class="text-xs text-red-600">⚠️ Incompatível (${unidadeInsumo})</p>` : ''}
          `;
        }).join('');

        // Event listeners para campos dos extras
        container.querySelectorAll('[data-extra-field]').forEach(el => {
          el.addEventListener('change', (e) => {
            const varIdx = parseInt(e.target.dataset.varIndex);
            const extraIdx = parseInt(e.target.dataset.extraIndex);
            const field = e.target.dataset.extraField;
            variacoesReceita[varIdx].extras[extraIdx][field] = e.target.value;
            
            // Se mudou o insumo, atualiza a unidade
            if (field === 'insumoId') {
              const ins = state.insumos.find(x => x.id == e.target.value);
              if (ins) variacoesReceita[varIdx].extras[extraIdx].unidade = ins.unidade;
            }
            renderExtrasVariacao(varIdx);
          });
        });

        // Event listeners para remover extra
        container.querySelectorAll('[data-action="remove-extra"]').forEach(el => {
          el.addEventListener('click', (e) => {
            const varIdx = parseInt(e.target.dataset.varIndex);
            const extraIdx = parseInt(e.target.dataset.extraIndex);
            variacoesReceita[varIdx].extras.splice(extraIdx, 1);
            renderExtrasVariacao(varIdx);
          });
        });
      }

      if (state.modalType === 'receita') {
        setupReceitaModal();
      }
      
      // ===== MODAL DE PRODUÇÃO: Listener para receita =====
      if (state.modalType === 'producao') {
        const receitaSelect = document.getElementById('receitaId');
        if (receitaSelect) {
          receitaSelect.addEventListener('change', (e) => {
            const receitaId = e.target.value;
            const receita = state.receitas.find(r => r.id == receitaId);
            
            if (!receita) {
              ocultarVariacoesProducao();
              return;
            }
            
            // Se tem variações, mostrar campos
            if (receita.variacoes && receita.variacoes.length > 0) {
              mostrarVariacoesProducao(receita);
            } else {
              ocultarVariacoesProducao();
            }
          });
        }
      }
      
      function mostrarVariacoesProducao(receita) {
        const container = document.getElementById('produtos-producao-container');
        const lista = document.getElementById('produtos-producao-list');
        
        if (!container || !lista) return;
        
        container.classList.remove('hidden');
        
        lista.innerHTML = receita.variacoes.map((variacao, idx) => `
          <div class="flex gap-2 items-center p-2 bg-gray-50 rounded border">
            <span class="text-sm flex-1 font-medium">${variacao.nome}</span>
            <input 
              type="number" 
              step="1"
              min="0"
              class="w-24 border rounded px-2 py-1 text-sm quantidade-variacao-producao" 
              placeholder="Quantidade"
              data-variacao-index="${idx}"
              value="0"
            >
            <span class="text-xs text-gray-500">un</span>
          </div>
        `).join('');
      }
      
      function ocultarVariacoesProducao() {
        const container = document.getElementById('produtos-producao-container');
        if (container) container.classList.add('hidden');
      }

      document.querySelectorAll('[data-action="save-producao"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const receitaId = document.getElementById('receitaId').value;
          const lotes = parseFloat(document.getElementById('lotes').value);
          const tipoProducao = btn.dataset.tipo || 'final';
          const ehIntermediario = tipoProducao === 'intermediario';
          
          if (!receitaId || !lotes) {
            return alert('Selecione a receita e defina os lotes');
          }
          
          const receita = state.receitas.find(r => r.id == receitaId);
          if (!receita) return alert('Receita não encontrada');
          
          // ===== VERIFICAR SE TEM VARIAÇÕES =====
          const temVariacoes = receita.variacoes && receita.variacoes.length > 0;
          
          if (temVariacoes) {
            // ===== PRODUÇÃO COM VARIAÇÕES =====
            const quantidadeInputs = document.querySelectorAll('.quantidade-variacao-producao');
            const variacoesParaProduzir = [];
            
            // Coletar quantidades de cada variação
            quantidadeInputs.forEach((input, idx) => {
              const qtd = parseFloat(input.value) || 0;
              if (qtd > 0) {
                variacoesParaProduzir.push({
                  variacao: receita.variacoes[idx],
                  quantidade: qtd
                });
              }
            });
            
            if (variacoesParaProduzir.length === 0) {
              return alert('Digite a quantidade de pelo menos uma variação');
            }
            
            // 1. DAR BAIXA NOS INGREDIENTES BASE (multiplicado por lotes)
            for (let ing of receita.ingredientes) {
              const insumo = state.insumos.find(i => i.id == ing.insumoId);
              if (!insumo) continue;
              
              const unidadeIng = ing.unidade || insumo.unidade;
              const qtdBase = ing.quantidade * lotes;
              const qtdConvertida = converterUnidade(qtdBase, unidadeIng, insumo.unidade);
              
              if (qtdConvertida === null) {
                alert(`Erro: unidade ${unidadeIng} incompatível com ${insumo.unidade} no insumo ${insumo.nome}`);
                return;
              }
              
              if (insumo.quantidade < qtdConvertida) {
                alert(`Estoque insuficiente de ${insumo.nome}. Necessário: ${qtdConvertida}${insumo.unidade}, Disponível: ${insumo.quantidade}${insumo.unidade}`);
                return;
              }
              
              insumo.quantidade -= qtdConvertida;
              await saveToFirebase('insumos', insumo.id, insumo);
            }
            
            // 2. DAR BAIXA NOS INGREDIENTES EXTRAS DE CADA VARIAÇÃO
            for (let vp of variacoesParaProduzir) {
              const variacao = vp.variacao;
              const qtdProduzir = vp.quantidade;
              
              if (!variacao.extras || variacao.extras.length === 0) continue;
              
              for (let extra of variacao.extras) {
                const insumo = state.insumos.find(i => i.id == extra.insumoId);
                if (!insumo) continue;
                
                const qtdTotal = extra.qtdPorUnidade * qtdProduzir;
                const qtdConvertida = converterUnidade(qtdTotal, extra.unidade, insumo.unidade);
                
                if (qtdConvertida === null) {
                  alert(`Erro: unidade ${extra.unidade} incompatível com ${insumo.unidade} no insumo ${insumo.nome}`);
                  return;
                }
                
                if (insumo.quantidade < qtdConvertida) {
                  alert(`Estoque insuficiente de ${insumo.nome} para ${variacao.nome}. Necessário: ${qtdConvertida}${insumo.unidade}, Disponível: ${insumo.quantidade}${insumo.unidade}`);
                  return;
                }
                
                insumo.quantidade -= qtdConvertida;
                await saveToFirebase('insumos', insumo.id, insumo);
              }
            }
            
            // 3. ADICIONAR PRODUTOS AO ESTOQUE
            for (let vp of variacoesParaProduzir) {
              const nomeProduto = vp.variacao.nome;
              const qtdProduzir = vp.quantidade;
              
              // Buscar se produto já existe
              const produtoExistente = state.produtos.find(p => 
                p.nome === nomeProduto && 
                p.userId === state.user.uid &&
                !p.ehIntermediario
              );
              
              if (produtoExistente) {
                produtoExistente.quantidade += qtdProduzir;
                await saveToFirebase('produtos', produtoExistente.id, produtoExistente);
              } else {
                // Criar novo produto
                const novoProduto = {
                  id: Date.now() + Math.random(),
                  nome: nomeProduto,
                  quantidade: qtdProduzir,
                  unidade: 'un',
                  custoUnitario: 0, // Usuario define depois
                  precoVenda: 0, // Usuario define depois
                  estoqueMinimo: 10,
                  receitaId: receita.id,
                  ehIntermediario: false,
                  userId: state.user.uid
                };
                await saveToFirebase('produtos', novoProduto.id, novoProduto);
                state.produtos.push(novoProduto);
              }
            }
            
            alert('✅ Produção concluída! Produtos adicionados ao estoque.');
            state.showModal = false;
            await loadAllData();
            render();
            
          } else {
            // ===== PRODUÇÃO ANTIGA (SEM VARIAÇÕES) =====
            const rendimento = parseFloat(document.getElementById('rendimento')?.value);
            const precoVendaInput = document.getElementById('precoVenda');
            const precoVenda = precoVendaInput ? parseFloat(precoVendaInput.value) : 0;
            
            if (!rendimento) {
              return alert('Preencha o rendimento');
            }
            
            if (!ehIntermediario && !precoVenda) {
              return alert('Preencha o preço de venda');
            }
            
            let custoTotal = 0;
            for (let ing of receita.ingredientes) {
              const insumo = state.insumos.find(i => i.id == ing.insumoId);
              if (!insumo) continue;
              const unidadeIng = ing.unidade || insumo.unidade;
              const qtdBase = ing.tipo === 'por_unidade' ? ing.quantidade * rendimento : ing.quantidade * lotes;
              const qtdConvertida = converterUnidade(qtdBase, unidadeIng, insumo.unidade);
              if (qtdConvertida === null) continue;
              custoTotal += qtdConvertida * insumo.precoMedio;
            }
            
            const custoUnitario = custoTotal / rendimento;
            
            for (let ing of receita.ingredientes) {
              const insumo = state.insumos.find(i => i.id == ing.insumoId);
              if (!insumo) continue;
              const unidadeIng = ing.unidade || insumo.unidade;
              const qtdBase = ing.tipo === 'por_unidade' ? ing.quantidade * rendimento : ing.quantidade * lotes;
              const qtdConvertida = converterUnidade(qtdBase, unidadeIng, insumo.unidade);
              if (qtdConvertida === null) continue;
              insumo.quantidade -= qtdConvertida;
              await saveToFirebase('insumos', insumo.id, insumo);
            }
            
            const produtoExistente = state.produtos.find(p => p.receitaId == receita.id && p.ehIntermediario == ehIntermediario);
            
            if (produtoExistente) {
              produtoExistente.quantidade += rendimento;
              await saveToFirebase('produtos', produtoExistente.id, produtoExistente);
            } else {
              const novoProduto = {
                id: Date.now(),
                receitaId: receita.id,
                nome: receita.nome,
                quantidade: rendimento,
                custoUnitario,
                precoVenda: ehIntermediario ? custoUnitario : precoVenda,
                estoqueMinimo: 10,
                ehIntermediario: ehIntermediario,
                userId: state.user.uid
              };
              await saveToFirebase('produtos', novoProduto.id, novoProduto);
              state.produtos.push(novoProduto);
            }
            
            state.showModal = false;
            await loadAllData();
            render();
          }
        });
      });

      document.querySelectorAll('[data-action="save-entrada"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const insumoId = document.getElementById('insumoId').value;
          const qtd = parseFloat(document.getElementById('qtdEntrada').value);
          const val = parseFloat(document.getElementById('valEntrada').value);
          
          if (!insumoId || !qtd || !val) return alert('Preencha todos os campos');
          
          const insumo = state.insumos.find(i => i.id == insumoId);
          if (!insumo) return alert('Insumo não encontrado');
          
          const precoNovo = val / qtd;
          const qtdTotal = insumo.quantidade + qtd;
          const precoMedio = ((insumo.quantidade * insumo.precoMedio) + (qtd * precoNovo)) / qtdTotal;
          
          insumo.quantidade = qtdTotal;
          insumo.precoMedio = precoMedio;
          
          await saveToFirebase('insumos', insumo.id, insumo);
          state.showModal = false;
          render();
        });
      });

      // Logout
      document.querySelectorAll('[data-action="logout"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (confirm('Deseja realmente sair?')) {
            try {
              // Deslogar do Firebase (v9 syntax)
              await signOut(auth);
              
              // Limpar TUDO do state
              state.user = null;
              state.showLoginScreen = true;
              state.activeTab = 'dashboard';
              state.insumos = [];
              state.receitas = [];
              state.produtos = [];
              state.clientes = [];
              state.vendas = [];
              state.movimentacoes = [];
              state.caixas = [];
              state.caixaAtual = null;
              state.despesasRecorrentes = [];
              state.showModal = false;
              state.modalType = '';
              state.editingId = null;
              state.loading = false;
              
              // Renderizar tela de login
              render();
              
              console.log('✅ Logout realizado com sucesso');
            } catch (error) {
              console.error('Erro ao fazer logout:', error);
              alert('Erro ao sair. Tente novamente.');
            }
          }
        });
      });


      // ===== CONFIGURAÇÕES =====
      document.querySelectorAll('[data-action="salvar-config"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const nomeEmpresa = document.getElementById('nome-empresa')?.value;
          
          if (!nomeEmpresa || nomeEmpresa.trim() === '') {
            alert('⚠️ Por favor, digite o nome da sua empresa');
            return;
          }
          
          const sucesso = await salvarConfiguracoes(nomeEmpresa.trim());
          
          if (sucesso) {
            alert('✅ Configurações salvas com sucesso!');
            render();
          } else {
            alert('❌ Erro ao salvar configurações. Tente novamente.');
          }
        });
      });
      
      // Alterar senha
      document.querySelectorAll('[data-action="alterar-senha"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const novaSenha = document.getElementById('nova-senha')?.value;
          const confirmarSenha = document.getElementById('confirmar-senha')?.value;
          
          if (!novaSenha || !confirmarSenha) {
            alert('⚠️ Preencha ambos os campos de senha');
            return;
          }
          
          if (novaSenha.length < 6) {
            alert('⚠️ A senha deve ter no mínimo 6 caracteres');
            return;
          }
          
          if (novaSenha !== confirmarSenha) {
            alert('⚠️ As senhas não coincidem');
            return;
          }
          
          try {
            await updatePassword(auth.currentUser, novaSenha);
            alert('✅ Senha alterada com sucesso!');
            document.getElementById('nova-senha').value = '';
            document.getElementById('confirmar-senha').value = '';
          } catch (error) {
            console.error('Erro ao alterar senha:', error);
            if (error.code === 'auth/requires-recent-login') {
              alert('⚠️ Por segurança, você precisa fazer login novamente antes de alterar a senha. Saia e entre novamente, depois tente alterar.');
            } else {
              alert('❌ Erro ao alterar senha. Tente novamente.');
            }
          }
        });
      });


      // ===== SUPORTE =====
      document.querySelectorAll('[data-action="open-support"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.showSupportModal = true;
          render();
        });
      });

      document.querySelectorAll('[data-action="close-support"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.showSupportModal = false;
          render();
        });
      });


      // Editar forma de pagamento da venda
      document.querySelectorAll('[data-action="edit-pagamento-venda"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.editingId = e.currentTarget.dataset.id;
          state.modalType = 'edit-pagamento-venda';
          state.showModal = true;
          render();
        });
      });
      
      // Salvar edição de forma de pagamento
      document.querySelectorAll('[data-action="save-edit-pagamento-venda"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const venda = state.vendas.find(v => v.id == state.editingId);
          if (!venda) return alert('Venda não encontrada');
          
          const novaForma = document.getElementById('novaFormaPagamento')?.value;
          if (!novaForma) return alert('Selecione a forma de pagamento');
          
          const formaAnterior = venda.formaPagamento;
          
          // Se está mudando de/para fiado, precisa ajustar saldo do cliente
          const cliente = state.clientes.find(c => c.id == venda.clienteId);
          if (cliente) {
            // Se estava fiado e agora vai ser pago: reduz dívida (adiciona ao saldo)
            if (formaAnterior === 'fiado' && novaForma !== 'fiado') {
              cliente.saldo += venda.valorFinal;
              await saveToFirebase('clientes', cliente.id, cliente);
            }
            // Se não estava fiado e agora vai ser: aumenta dívida (reduz do saldo)
            else if (formaAnterior !== 'fiado' && novaForma === 'fiado') {
              cliente.saldo -= venda.valorFinal;
              await saveToFirebase('clientes', cliente.id, cliente);
            }
          }
          
          // Atualizar venda
          venda.formaPagamento = novaForma;
          await saveToFirebase('vendas', venda.id, venda);
          
          state.showModal = false;
          state.editingId = null;
          render();
        });
      });
      
      // Deletar venda
      document.querySelectorAll('[data-action="delete-venda"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (!confirm('⚠️ ATENÇÃO: Deletar venda irá DEVOLVER os produtos ao estoque e ajustar o saldo do cliente. Confirma?')) return;
          
          const id = e.currentTarget.dataset.id;
          const venda = state.vendas.find(v => v.id == id);
          if (!venda) return alert('Venda não encontrada');
          
          // 1. Devolver produtos ao estoque
          for (let item of venda.itens) {
            const produto = state.produtos.find(p => p.id == item.produtoId);
            if (produto) {
              produto.quantidade += item.quantidade;
              await saveToFirebase('produtos', produto.id, produto);
            }
          }
          
          // 2. Ajustar saldo do cliente
          const cliente = state.clientes.find(c => c.id == venda.clienteId);
          if (cliente) {
            // Se estava fiado: reduz dívida (adiciona ao saldo)
            if (venda.formaPagamento === 'fiado') {
              cliente.saldo += venda.valorFinal;
            }
            // Se usou crédito: devolve crédito
            if (venda.creditoUsado > 0) {
              cliente.saldo += venda.creditoUsado;
            }
            await saveToFirebase('clientes', cliente.id, cliente);
          }
          
          // 3. Deletar venda
          await deleteFromFirebase('vendas', id);
          state.vendas = state.vendas.filter(v => v.id != id);
          
          alert('✅ Venda deletada! Estoque e saldo ajustados.');
          render();
        });
      });

      // Busca de clientes
      const searchCliente = document.getElementById('search-cliente');
      if (searchCliente) {
        searchCliente.addEventListener('input', (e) => {
          const termo = e.target.value.toLowerCase();
          document.querySelectorAll('.cliente-row').forEach(row => {
            const nome = row.dataset.nome;
            row.style.display = nome.includes(termo) ? '' : 'none';
          });
        });
      }

      // Busca de insumos
      const searchInsumo = document.getElementById('search-insumo');
      if (searchInsumo) {
        searchInsumo.addEventListener('input', (e) => {
          const termo = e.target.value.toLowerCase();
          document.querySelectorAll('.insumo-row').forEach(row => {
            const nome = row.dataset.nome;
            row.style.display = nome.includes(termo) ? '' : 'none';
          });
        });
      }

      // Sistema de Vendas
      let itensVenda = [];
      let usarCredito = false;

      if (state.modalType === 'venda') {
        setupVendaModal();
      }

      function setupVendaModal() {
        renderItensVenda();

        document.querySelectorAll('[data-action="add-item-venda"]').forEach(btn => {
          btn.onclick = () => {
            itensVenda.push({produtoId: '', quantidade: 1});
            renderItensVenda();
          };
        });

        const descontoInput = document.getElementById('descontoVenda');
        const clienteSelect = document.getElementById('clienteVenda');
        if (descontoInput) descontoInput.addEventListener('input', calcularResumoVenda);
        if (clienteSelect) clienteSelect.addEventListener('change', calcularResumoVenda);

        document.querySelectorAll('[data-action="save-venda"]').forEach(btn => {
          btn.onclick = async () => {
            const cliId = document.getElementById('clienteVenda').value;
            const desconto = parseFloat(document.getElementById('descontoVenda').value || 0);
            const pagamento = document.getElementById('pagamentoVenda').value;

            // Cliente é obrigatório APENAS se fiado
            if (pagamento === 'fiado' && !cliId) {
              return alert('⚠️ Para venda fiada, selecione um cliente!');
            }
            
            if (itensVenda.length === 0) {
              return alert('⚠️ Adicione produtos à venda!');
            }

            for (let item of itensVenda) {
              const p = state.produtos.find(pr => pr.id == item.produtoId);
              if (!p || p.quantidade < item.quantidade) {
                return alert(`Estoque insuficiente: ${p?.nome || 'produto'}`);
              }
            }

            const cliente = cliId ? state.clientes.find(c => c.id == cliId) : null;
            const creditoDisponivel = cliente && cliente.saldo > 0 ? cliente.saldo : 0;

            const subtotal = itensVenda.reduce((t, item) => {
              const p = state.produtos.find(pr => pr.id == item.produtoId);
              return t + (p.precoVenda * item.quantidade);
            }, 0);

            const creditoUsado = usarCredito ? Math.min(creditoDisponivel, subtotal - desconto) : 0;
            const valorFinal = subtotal - desconto - creditoUsado;

            const itensAgrupados = {};
            itensVenda.forEach(item => {
              const id = parseInt(item.produtoId);
              if (itensAgrupados[id]) {
                itensAgrupados[id].quantidade += item.quantidade;
              } else {
                const p = state.produtos.find(pr => pr.id == id);
                itensAgrupados[id] = {
                  produtoId: id,
                  quantidade: item.quantidade,
                  precoUnitario: p.precoVenda
                };
              }
            });

            for (let id in itensAgrupados) {
              const produto = state.produtos.find(p => p.id == id);
              if (produto) {
                produto.quantidade -= itensAgrupados[id].quantidade;
                await saveToFirebase('produtos', produto.id, produto);
              }
            }

            // Só mexe no saldo se tiver cliente
            if (cliente) {
              let novoSaldo = cliente.saldo;
              if (usarCredito && creditoUsado > 0) {
                novoSaldo -= creditoUsado;
              }
              if (pagamento === 'fiado') {
                novoSaldo -= valorFinal;
              }

              cliente.saldo = novoSaldo;
              await saveToFirebase('clientes', cliente.id, cliente);
            }

            const novaVenda = {
              id: Date.now(),
              data: new Date().toISOString(),
              clienteId: cliId ? parseInt(cliId) : null,
              clienteNome: cliente ? cliente.nome : 'Venda Avulsa',
              itens: Object.values(itensAgrupados).map(item => {
                const p = state.produtos.find(pr => pr.id == item.produtoId);
                return {
                  ...item,
                  produtoNome: p ? p.nome : 'Produto'
                };
              }),
              subtotal,
              desconto,
              creditoUsado,
              total: valorFinal, // ← ADICIONADO
              valorFinal,
              formaPagamento: pagamento
            };

            const vendaSalva = await saveToFirebase('vendas', novaVenda.id, novaVenda);
            
            if (!vendaSalva) {
              alert('⚠️ Erro ao salvar venda! Verifique as Regras do Firestore.');
              return;
            }
            
            state.vendas.push(novaVenda);

            if (pagamento !== 'fiado') {
              const mov = {
                id: Date.now() + 1,
                tipo: 'entrada',
                data: new Date().toISOString(),
                descricao: `Venda - ${cliente.nome} (${pagamento})`,
                valor: valorFinal
              };
              await saveToFirebase('movimentacoes', mov.id, mov);
              state.movimentacoes.push(mov);
            }

            itensVenda = [];
            usarCredito = false;
            state.showModal = false;
            await loadAllData();
          };
        });
      }

      function renderItensVenda() {
        const list = document.getElementById('itens-venda-list');
        if (!list) return;

        list.innerHTML = itensVenda.map((item, i) => `
          <div class="flex gap-2 mb-2">
            <select class="flex-1 border rounded px-3 py-2" data-item-field="produtoId" data-item-index="${i}">
              <option value="">Selecione...</option>
              ${state.produtos.map(p => `<option value="${p.id}" ${item.produtoId == p.id ? 'selected' : ''}>${p.nome} - R$ ${p.precoVenda.toFixed(2)} (est: ${p.quantidade})</option>`).join('')}
            </select>
            <input type="number" min="1" placeholder="Qtd" class="w-20 border rounded px-3 py-2" data-item-field="quantidade" data-item-index="${i}" value="${item.quantidade}">
            <button type="button" data-action="remove-item" data-item-index="${i}" class="text-red-500 hover:text-red-600 px-2">🗑️</button>
          </div>
        `).join('');

        list.querySelectorAll('[data-item-field]').forEach(el => {
          el.addEventListener('change', (e) => {
            const idx = parseInt(e.target.dataset.itemIndex);
            const field = e.target.dataset.itemField;
            itensVenda[idx][field] = field === 'quantidade' ? parseInt(e.target.value) : e.target.value;
            calcularResumoVenda();
          });
        });

        list.querySelectorAll('[data-action="remove-item"]').forEach(el => {
          el.addEventListener('click', (e) => {
            const idx = parseInt(e.target.dataset.itemIndex);
            itensVenda.splice(idx, 1);
            renderItensVenda();
          });
        });

        calcularResumoVenda();
      }

      function calcularResumoVenda() {
        const cliId = document.getElementById('clienteVenda')?.value;
        const desconto = parseFloat(document.getElementById('descontoVenda')?.value || 0);
        
        const cliente = state.clientes.find(c => c.id == cliId);
        const creditoDisponivel = cliente && cliente.saldo > 0 ? cliente.saldo : 0;

        const subtotal = itensVenda.reduce((t, item) => {
          const p = state.produtos.find(pr => pr.id == item.produtoId);
          if (!p) return t;
          return t + (p.precoVenda * (parseInt(item.quantidade) || 0));
        }, 0);

        const creditoUsado = usarCredito ? Math.min(creditoDisponivel, subtotal - desconto) : 0;
        const valorFinal = subtotal - desconto - creditoUsado;

        const creditoContainer = document.getElementById('usar-credito-container');
        if (creditoContainer) {
          if (creditoDisponivel > 0) {
            creditoContainer.innerHTML = `
              <div class="p-3 bg-green-50 rounded">
                <label class="flex items-center gap-2">
                  <input type="checkbox" id="checkbox-credito" ${usarCredito ? 'checked' : ''}>
                  <span class="text-sm">Usar crédito: R$ ${creditoDisponivel.toFixed(2)}</span>
                </label>
              </div>
            `;
            document.getElementById('checkbox-credito')?.addEventListener('change', (e) => {
              usarCredito = e.target.checked;
              calcularResumoVenda();
            });
          } else {
            creditoContainer.innerHTML = '';
          }
        }

        const resumo = document.getElementById('resumo-venda');
        const resumoText = document.getElementById('resumo-venda-text');
        if (resumo && resumoText && itensVenda.length > 0) {
          resumoText.innerHTML = `
            Subtotal: R$ ${subtotal.toFixed(2)}<br>
            ${desconto > 0 ? `<span class="text-red-600">Desconto: -R$ ${desconto.toFixed(2)}</span><br>` : ''}
            ${creditoUsado > 0 ? `<span class="text-green-600">Crédito: -R$ ${creditoUsado.toFixed(2)}</span><br>` : ''}
            <span class="font-bold text-blue-700">Total: R$ ${valorFinal.toFixed(2)}</span>
          `;
          resumo.classList.remove('hidden');
        } else if (resumo) {
          resumo.classList.add('hidden');
        }
      }
      
      // ===== EDITAR/EXCLUIR MOVIMENTAÇÃO =====
      
      // Excluir movimentação
      document.querySelectorAll('[data-action="excluir-mov"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (confirm('⚠️ Tem certeza que deseja excluir esta movimentação?\n\nEsta ação não pode ser desfeita.')) {
            const id = e.currentTarget.dataset.id;
            await deleteFromFirebase('movimentacoes', id);
            state.movimentacoes = state.movimentacoes.filter(m => m.id != id);
            alert('✅ Movimentação excluída!');
            render();
          }
        });
      });
      
      // Editar movimentação
      document.querySelectorAll('[data-action="editar-mov"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.dataset.id;
          const mov = state.movimentacoes.find(m => m.id == id);
          
          if (!mov) return alert('❌ Movimentação não encontrada');
          
          // Pedir nova descrição
          const novaDesc = prompt('📝 Descrição:', mov.descricao);
          if (novaDesc === null) return; // Cancelou
          
          // Pedir novo valor
          const novoValor = prompt('💰 Valor (R$):', mov.valor.toFixed(2));
          if (novoValor === null) return; // Cancelou
          
          const valorFloat = parseFloat(novoValor.replace(',', '.'));
          if (isNaN(valorFloat) || valorFloat <= 0) {
            return alert('❌ Valor inválido!');
          }
          
          // Atualizar
          mov.descricao = novaDesc.trim() || mov.descricao;
          mov.valor = valorFloat;
          
          saveToFirebase('movimentacoes', mov.id, mov).then(() => {
            alert('✅ Movimentação atualizada!');
            render();
          });
        });
      });

      // ===== DESPESAS RECORRENTES =====
      
      // Toggle tipo de valor (fixo/variável)
      document.querySelectorAll('input[name="tipoValor"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          const valorDiv = document.getElementById('valor-fixo-div');
          if (valorDiv) {
            valorDiv.style.display = e.target.value === 'fixo' ? 'block' : 'none';
          }
        });
      });
      
      // Toggle parcelas no modal
      const tipoDespSelect = document.getElementById('tipoDespesaRec');
      if (tipoDespSelect) {
        tipoDespSelect.addEventListener('change', () => {
          const parcelasDiv = document.getElementById('parcelas-div');
          if (parcelasDiv) {
            parcelasDiv.style.display = tipoDespSelect.value === 'parcelado' ? 'block' : 'none';
          }
        });
      }
      
      // Salvar despesa
      document.querySelectorAll('[data-action="save-despesa-rec"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const nome = document.getElementById('nomeDespesaRec')?.value;
          const tipoValor = document.querySelector('input[name="tipoValor"]:checked')?.value;
          const valor = parseFloat(document.getElementById('valorDespesaRec')?.value) || 0;
          const tipo = document.getElementById('tipoDespesaRec')?.value;
          const diaVencimento = parseInt(document.getElementById('diaVencimento')?.value);
          const categoria = document.getElementById('categoriaDespesaRec')?.value;
          
          if (!nome || !diaVencimento) {
            return alert('Preencha nome e dia de vencimento');
          }
          
          if (tipoValor === 'fixo' && !valor) {
            return alert('Digite o valor da despesa');
          }
          
          const novaDespesa = {
            id: Date.now(),
            nome,
            valor: tipoValor === 'fixo' ? valor : 0,
            valorVariavel: tipoValor === 'variavel',
            tipo,
            diaVencimento,
            categoria,
            dataInicio: new Date().toISOString()
          };
          
          if (tipo === 'parcelado') {
            novaDespesa.totalParcelas = parseInt(document.getElementById('totalParcelas')?.value) || 12;
          }
          
          await saveToFirebase('despesasRecorrentes', novaDespesa.id, novaDespesa);
          state.despesasRecorrentes.push(novaDespesa);
          
          state.showModal = false;
          render();
        });
      });
      
      // Pagar despesa
      document.querySelectorAll('[data-action="pagar-despesa-rec"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.dataset.id;
          let valor = parseFloat(e.currentTarget.dataset.valor);
          const nome = e.currentTarget.dataset.nome;
          const variavel = e.currentTarget.dataset.variavel === 'true';
          
          // Se for despesa variável, pedir o valor
          if (variavel) {
            const valorDigitado = prompt(`💰 ${nome}\n\nDigite o valor da despesa este mês:\n(Ex: 150.50)`);
            if (!valorDigitado) return;
            
            valor = parseFloat(valorDigitado.replace(',', '.'));
            if (isNaN(valor) || valor <= 0) {
              return alert('❌ Valor inválido!');
            }
          }
          
          if (confirm(`Registrar pagamento de ${nome} - R$ ${valor.toFixed(2)}?`)) {
            const hoje = new Date();
            const mesAnoKey = `${hoje.getMonth()}-${hoje.getFullYear()}`;
            
            const mov = {
              id: Date.now(),
              tipo: 'saida',
              categoria: 'despesa-recorrente',
              despesaRecorrenteId: parseInt(id),
              mesAno: mesAnoKey,
              data: new Date().toISOString(),
              descricao: `Pagamento: ${nome}`,
              valor
            };
            
            await saveToFirebase('movimentacoes', mov.id, mov);
            state.movimentacoes.push(mov);
            
            alert('✅ Pagamento registrado!');
            render();
          }
        });
      });
      
      // Deletar despesa
      document.querySelectorAll('[data-action="delete-despesa-rec"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (confirm('Tem certeza que deseja excluir?')) {
            const id = e.currentTarget.dataset.id;
            await deleteFromFirebase('despesasRecorrentes', id);
            state.despesasRecorrentes = state.despesasRecorrentes.filter(d => d.id != id);
            render();
          }
        });
      });
    }



      // ===== FLUXO DE CAIXA =====
      document.querySelectorAll('[data-action="save-abrir-caixa"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const saldoInicial = parseFloat(document.getElementById('saldoInicial').value) || 0;
          
          const novoCaixa = {
            id: Date.now(),
            dataAbertura: new Date().toISOString(),
            saldoInicial,
            saldoFinal: 0,
            status: 'aberto'
          };
          
          await saveToFirebase('caixas', novoCaixa.id, novoCaixa);
          state.caixas.push(novoCaixa);
          state.caixaAtual = novoCaixa;
          
          state.showModal = false;
          render();
        });
      });

      document.querySelectorAll('[data-action="save-sangria"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const valor = parseFloat(document.getElementById('valorSangria').value);
          const motivo = document.getElementById('motivoSangria').value;
          
          if (!valor || !motivo) return alert('Preencha todos os campos');
          
          const mov = {
            id: Date.now(),
            tipo: 'saida',
            categoria: 'sangria',
            data: new Date().toISOString(),
            descricao: `Sangria: ${motivo}`,
            valor
          };
          
          await saveToFirebase('movimentacoes', mov.id, mov);
          state.movimentacoes.push(mov);
          
          state.showModal = false;
          render();
        });
      });

      document.querySelectorAll('[data-action="save-reforco"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const valor = parseFloat(document.getElementById('valorReforco').value);
          const motivo = document.getElementById('motivoReforco').value;
          
          if (!valor || !motivo) return alert('Preencha todos os campos');
          
          const mov = {
            id: Date.now(),
            tipo: 'entrada',
            categoria: 'reforco',
            data: new Date().toISOString(),
            descricao: `Reforço: ${motivo}`,
            valor
          };
          
          await saveToFirebase('movimentacoes', mov.id, mov);
          state.movimentacoes.push(mov);
          
          state.showModal = false;
          render();
        });
      });

      document.querySelectorAll('[data-action="save-despesa"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const valor = parseFloat(document.getElementById('valorDespesa').value);
          const descricao = document.getElementById('descricaoDespesa').value;
          const categoria = document.getElementById('categoriaDespesa').value;
          
          if (!valor || !descricao) return alert('Preencha todos os campos');
          
          const mov = {
            id: Date.now(),
            tipo: 'saida',
            categoria,
            data: new Date().toISOString(),
            descricao,
            valor
          };
          
          await saveToFirebase('movimentacoes', mov.id, mov);
          state.movimentacoes.push(mov);
          
          state.showModal = false;
          render();
        });
      });

      // Calcular diferença no fechamento de caixa
      const saldoRealInput = document.getElementById('saldoReal');
      if (saldoRealInput && state.modalType === 'fechar-caixa') {
        saldoRealInput.addEventListener('input', () => {
          const movHoje = state.movimentacoes.filter(m => new Date(m.data).toDateString() === new Date().toDateString());
          const entradas = movHoje.filter(m => m.tipo === 'entrada').reduce((t, m) => t + m.valor, 0);
          const saidas = movHoje.filter(m => m.tipo === 'saida').reduce((t, m) => t + m.valor, 0);
          const saldoCalculado = state.caixaAtual.saldoInicial + entradas - saidas;
          const saldoReal = parseFloat(saldoRealInput.value) || 0;
          const diferenca = saldoReal - saldoCalculado;
          
          const diferencaDiv = document.getElementById('diferenca-caixa');
          if (diferencaDiv && diferenca !== 0) {
            diferencaDiv.innerHTML = `
              <div class="p-3 rounded ${diferenca > 0 ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}">
                <p class="text-sm font-medium ${diferenca > 0 ? 'text-green-700' : 'text-red-700'}">
                  ${diferenca > 0 ? 'Sobra' : 'Falta'}: R$ ${Math.abs(diferenca).toFixed(2)}
                </p>
              </div>
            `;
          } else if (diferencaDiv) {
            diferencaDiv.innerHTML = '';
          }
        });
      }


      // ===== DESPESAS RECORRENTES =====
      
      // Toggle tipo de valor (fixo/variável)
      document.querySelectorAll('input[name="tipoValor"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          const valorDiv = document.getElementById('valor-fixo-div');
          if (valorDiv) {
            valorDiv.style.display = e.target.value === 'fixo' ? 'block' : 'none';
          }
        });
      });
      
      // Toggle parcelas no modal
      const tipoDespSelect = document.getElementById('tipoDespesaRec');
      if (tipoDespSelect) {
        tipoDespSelect.addEventListener('change', () => {
          const parcelasDiv = document.getElementById('parcelas-div');
          if (parcelasDiv) {
            parcelasDiv.style.display = tipoDespSelect.value === 'parcelado' ? 'block' : 'none';
          }
        });
      }
      
      // Salvar despesa
      document.querySelectorAll('[data-action="save-despesa-rec"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const nome = document.getElementById('nomeDespesaRec')?.value;
          const tipoValor = document.querySelector('input[name="tipoValor"]:checked')?.value;
          const valor = parseFloat(document.getElementById('valorDespesaRec')?.value) || 0;
          const tipo = document.getElementById('tipoDespesaRec')?.value;
          const diaVencimento = parseInt(document.getElementById('diaVencimento')?.value);
          const categoria = document.getElementById('categoriaDespesaRec')?.value;
          
          if (!nome || !diaVencimento) {
            return alert('Preencha nome e dia de vencimento');
          }
          
          if (tipoValor === 'fixo' && !valor) {
            return alert('Digite o valor da despesa');
          }
          
          const novaDespesa = {
            id: Date.now(),
            nome,
            valor: tipoValor === 'fixo' ? valor : 0,
            valorVariavel: tipoValor === 'variavel',
            tipo,
            diaVencimento,
            categoria,
            dataInicio: new Date().toISOString()
          };
          
          if (tipo === 'parcelado') {
            novaDespesa.totalParcelas = parseInt(document.getElementById('totalParcelas')?.value) || 12;
          }
          
          await saveToFirebase('despesasRecorrentes', novaDespesa.id, novaDespesa);
          state.despesasRecorrentes.push(novaDespesa);
          
          state.showModal = false;
          render();
        });
      });
      
      // Pagar despesa
      document.querySelectorAll('[data-action="pagar-despesa-rec"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.dataset.id;
          let valor = parseFloat(e.currentTarget.dataset.valor);
          const nome = e.currentTarget.dataset.nome;
          const variavel = e.currentTarget.dataset.variavel === 'true';
          
          // Se for despesa variável, pedir o valor
          if (variavel) {
            const valorDigitado = prompt(`💰 ${nome}\n\nDigite o valor da despesa este mês:\n(Ex: 150.50)`);
            if (!valorDigitado) return;
            
            valor = parseFloat(valorDigitado.replace(',', '.'));
            if (isNaN(valor) || valor <= 0) {
              return alert('❌ Valor inválido!');
            }
          }
          
          if (confirm(`Registrar pagamento de ${nome} - R$ ${valor.toFixed(2)}?`)) {
            const hoje = new Date();
            const mesAnoKey = `${hoje.getMonth()}-${hoje.getFullYear()}`;
            
            const mov = {
              id: Date.now(),
              tipo: 'saida',
              categoria: 'despesa-recorrente',
              despesaRecorrenteId: parseInt(id),
              mesAno: mesAnoKey,
              data: new Date().toISOString(),
              descricao: `Pagamento: ${nome}`,
              valor
            };
            
            await saveToFirebase('movimentacoes', mov.id, mov);
            state.movimentacoes.push(mov);
            
            alert('✅ Pagamento registrado!');
            render();
          }
        });
      });
      
      // Deletar despesa
      document.querySelectorAll('[data-action="delete-despesa-rec"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (confirm('Tem certeza que deseja excluir?')) {
            const id = e.currentTarget.dataset.id;
            await deleteFromFirebase('despesasRecorrentes', id);
            state.despesasRecorrentes = state.despesasRecorrentes.filter(d => d.id != id);
            render();
          }
        });
      });
      
    // ============================================
    loadAllData();
  </script>
</body>
</html>
