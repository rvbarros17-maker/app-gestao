<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00aaff">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geladinhos Gourmet</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXJReFAHvGx8oqX3KU7yB37L8fNa3DkiA",
      authDomain: "app-gestao-47669.firebaseapp.com",
      projectId: "app-gestao-47669",
      storageBucket: "app-gestao-47669.firebasestorage.app",
      messagingSenderId: "33460108207",
      appId: "1:33460108207:web:29fd5d0ed97c44e92a4d5a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let state = {
      activeTab: 'dashboard',
      insumos: [],
      receitas: [],
      produtos: [],
      clientes: [],
      vendas: [],
      movimentacoes: [],
      showModal: false,
      modalType: '',
      editingId: null,
      loading: true
    };

    async function saveToFirebase(collectionName, id, data) {
      try {
        await setDoc(doc(db, collectionName, String(id)), data);
        return true;
      } catch (e) {
        console.error('Erro ao salvar:', e);
        alert('Erro ao salvar dados. Tente novamente.');
        return false;
      }
    }

    async function loadFromFirebase(collectionName) {
      try {
        const querySnapshot = await getDocs(collection(db, collectionName));
        const data = [];
        querySnapshot.forEach((docSnap) => {
          const docData = docSnap.data();
          data.push({ ...docData, id: docData.id || docSnap.id });
        });
        return data;
      } catch (e) {
        console.error('Erro ao carregar:', e);
        return [];
      }
    }

    async function deleteFromFirebase(collectionName, id) {
      try {
        await deleteDoc(doc(db, collectionName, String(id)));
        return true;
      } catch (e) {
        console.error('Erro ao deletar:', e);
        return false;
      }
    }

    async function loadAllData() {
      state.loading = true;
      render();
      
      try {
        const [insumos, receitas, produtos, clientes, vendas, movimentacoes] = await Promise.all([
          loadFromFirebase('insumos'),
          loadFromFirebase('receitas'),
          loadFromFirebase('produtos'),
          loadFromFirebase('clientes'),
          loadFromFirebase('vendas'),
          loadFromFirebase('movimentacoes')
        ]);

        state.insumos = insumos;
        state.receitas = receitas;
        state.produtos = produtos;
        state.clientes = clientes;
        state.vendas = vendas;
        state.movimentacoes = movimentacoes;
        state.loading = false;
        
        render();
      } catch (e) {
        console.error('Erro ao carregar dados:', e);
        state.loading = false;
        render();
      }
    }

    function render() {
      const root = document.getElementById('root');
      
      if (state.loading) {
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
              <div class="text-6xl mb-4">⏳</div>
              <p class="text-xl font-bold">Carregando dados da nuvem...</p>
              <p class="text-gray-600 mt-2">Aguarde um momento</p>
            </div>
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="min-h-screen p-4">
          <div class="max-w-7xl mx-auto">
            <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-6 rounded-lg shadow-lg mb-6">
              <h1 class="text-3xl font-bold">🍧 Geladinhos Gourmet</h1>
              <p class="text-blue-100">Sistema Completo de Gestão - Cloud ☁️</p>
            </div>

            ${state.activeTab !== 'dashboard' ? `
              <div class="mb-4">
                <button data-action="voltar-dashboard" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 flex items-center gap-2">
                  ← Voltar ao Menu
                </button>
              </div>
            ` : ''}

            <div class="bg-white rounded-lg shadow p-6">
              ${renderContent()}
            </div>
          </div>
        </div>

        ${state.showModal ? renderModal() : ''}
      `;

      attachEventListeners();
    }

    function renderTab(id, icon, label) {
      const isActive = state.activeTab === id;
      return `
        <button 
          data-tab="${id}"
          class="px-4 py-3 font-medium flex items-center gap-2 whitespace-nowrap ${isActive ? 'border-b-2 border-blue-500 text-blue-500' : 'text-gray-600'}"
        >
          <span>${icon}</span> ${label}
        </button>
      `;
    }

    function renderContent() {
      switch(state.activeTab) {
        case 'dashboard': return renderDashboard();
        case 'clientes': return renderClientes();
        case 'insumos': return renderInsumos();
        case 'receitas': return renderReceitas();
        case 'produtos': return renderProdutos();
        case 'vendas': return renderVendas();
        case 'financeiro': return renderFinanceiro();
        case 'relatorios': return renderRelatorios();
        case 'lista-compras': return renderListaCompras();
        default: return '<p>Selecione uma aba</p>';
      }
    }

    function renderDashboard() {
      const hoje = new Date().toDateString();
      const vendasHoje = state.vendas.filter(v => new Date(v.data).toDateString() === hoje);
      const faturamento = vendasHoje.reduce((t, v) => t + (v.valorFinal || 0), 0);
      
      return `
        <div class="text-center mb-6">
          <h2 class="text-3xl font-bold mb-2">🍧 Geladinhos Gourmet</h2>
          <p class="text-gray-600">Selecione uma opção abaixo</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
          <button data-nav="clientes" class="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-6 rounded-lg shadow-lg hover:shadow-xl transition-all hover:scale-105">
            <div class="text-5xl mb-3">👥</div>
            <h3 class="text-xl font-bold mb-2">Clientes</h3>
            <p class="text-sm opacity-90">${state.clientes.length} cadastrados</p>
          </button>

          <button data-nav="insumos" class="bg-gradient-to-br from-orange-500 to-orange-600 text-white p-6 rounded-lg shadow-lg hover:shadow-xl transition-all hover:scale-105">
            <div class="text-5xl mb-3">📦</div>
            <h3 class="text-xl font-bold mb-2">Insumos</h3>
            <p class="text-sm opacity-90">${state.insumos.length} itens</p>
          </button>

          <button data-nav="receitas" class="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-6 rounded-lg shadow-lg hover:shadow-xl transition-all hover:scale-105">
            <div class="text-5xl mb-3">📝</div>
            <h3 class="text-xl font-bold mb-2">Receitas</h3>
            <p class="text-sm opacity-90">${state.receitas.length} receitas</p>
          </button>

          <button data-nav="produtos" class="bg-gradient-to-br from-pink-500 to-pink-600 text-white p-6 rounded-lg shadow-lg hover:shadow-xl transition-all hover:scale-105">
            <div class="text-5xl mb-3">🍧</div>
            <h3 class="text-xl font-bold mb-2">Produtos</h3>
            <p class="text-sm opacity-90">${state.produtos.length} em estoque</p>
          </button>

          <button data-nav="vendas" class="bg-gradient-to-br from-green-500 to-green-600 text-white p-6 rounded-lg shadow-lg hover:shadow-xl transition-all hover:scale-105">
            <div class="text-5xl mb-3">🛒</div>
            <h3 class="text-xl font-bold mb-2">Vendas</h3>
            <p class="text-sm opacity-90">${state.vendas.length} registradas</p>
          </button>

          <button data-nav="financeiro" class="bg-gradient-to-br from-yellow-500 to-yellow-600 text-white p-6 rounded-lg shadow-lg hover:shadow-xl transition-all hover:scale-105">
            <div class="text-5xl mb-3">💰</div>
            <h3 class="text-xl font-bold mb-2">Financeiro</h3>
            <p class="text-sm opacity-90">Controle financeiro</p>
          </button>

          <button data-nav="relatorios" class="bg-gradient-to-br from-indigo-500 to-indigo-600 text-white p-6 rounded-lg shadow-lg hover:shadow-xl transition-all hover:scale-105">
            <div class="text-5xl mb-3">📊</div>
            <h3 class="text-xl font-bold mb-2">Relatórios</h3>
            <p class="text-sm opacity-90">Análises e dados</p>
          </button>

          <button data-nav="lista-compras" class="bg-gradient-to-br from-red-500 to-red-600 text-white p-6 rounded-lg shadow-lg hover:shadow-xl transition-all hover:scale-105">
            <div class="text-5xl mb-3">🛒</div>
            <h3 class="text-xl font-bold mb-2">Lista de Compras</h3>
            <p class="text-sm opacity-90">${state.insumos.filter(i => i.quantidade <= i.estoqueMinimo).length} itens faltando</p>
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-gradient-to-br from-green-500 to-green-600 text-white p-4 rounded-lg">
            <p class="text-sm opacity-90">Vendas Hoje</p>
            <p class="text-2xl font-bold">R$ ${faturamento.toFixed(2)}</p>
            <p class="text-xs opacity-75">${vendasHoje.length} vendas</p>
          </div>
          <div class="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-4 rounded-lg">
            <p class="text-sm opacity-90">Total Clientes</p>
            <p class="text-2xl font-bold">${state.clientes.length}</p>
            <p class="text-xs opacity-75">Cadastrados</p>
          </div>
          <div class="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-4 rounded-lg">
            <p class="text-sm opacity-90">Produtos</p>
            <p class="text-2xl font-bold">${state.produtos.length}</p>
            <p class="text-xs opacity-75">Em estoque</p>
          </div>
        </div>
      `;
    }

    function renderClientes() {
      const clientesOrdenados = [...state.clientes].sort((a, b) => a.nome.localeCompare(b.nome));
      
      return `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold">Clientes</h2>
          <button data-action="modal" data-modal="cliente" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            ➕ Novo Cliente
          </button>
        </div>
        <div class="mb-4">
          <input type="text" id="search-cliente" placeholder="🔍 Buscar cliente..." class="w-full border rounded px-4 py-2">
        </div>
        ${clientesOrdenados.length > 0 ? `
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-3 text-left text-sm font-medium">Nome</th>
                  <th class="px-4 py-3 text-left text-sm font-medium">Telefone</th>
                  <th class="px-4 py-3 text-left text-sm font-medium">Saldo</th>
                  <th class="px-4 py-3 text-left text-sm font-medium">Ações</th>
                </tr>
              </thead>
              <tbody id="clientes-tbody">
                ${clientesOrdenados.map(c => `
                  <tr class="border-t cliente-row" data-nome="${c.nome.toLowerCase()}">
                    <td class="px-4 py-3">${c.nome}</td>
                    <td class="px-4 py-3">${c.telefone}</td>
                    <td class="px-4 py-3">
                      <span class="${c.saldo < 0 ? 'text-red-600 font-medium' : c.saldo > 0 ? 'text-green-600 font-medium' : ''}">
                        R$ ${Math.abs(c.saldo).toFixed(2)}
                      </span>
                    </td>
                    <td class="px-4 py-3">
                      <div class="flex gap-2">
                        ${c.saldo < 0 ? `<button data-action="pagar-divida" data-id="${c.id}" class="text-green-500 hover:text-green-600" title="Pagar Dívida">💰</button>` : ''}
                        <button data-action="edit-cliente" data-id="${c.id}" class="text-blue-500 hover:text-blue-600">✏️</button>
                        <button data-action="delete-cliente" data-id="${c.id}" class="text-red-500 hover:text-red-600">🗑️</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        ` : `
          <div class="text-center py-12 text-gray-500">
            <div class="text-6xl mb-4">👥</div>
            <p>Nenhum cliente cadastrado</p>
            <button data-action="modal" data-modal="cliente" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
              Cadastrar Primeiro Cliente
            </button>
          </div>
        `}
      `;
    }

    function renderInsumos() {
      const insumosOrdenados = [...state.insumos].sort((a, b) => a.nome.localeCompare(b.nome));
      
      return `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold">Insumos</h2>
          <div class="flex gap-2">
            <button data-action="modal" data-modal="entrada" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
              📈 Entrada
            </button>
            <button data-action="modal" data-modal="insumo" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
              ➕ Novo
            </button>
          </div>
        </div>
        <div class="mb-4">
          <input type="text" id="search-insumo" placeholder="🔍 Buscar insumo..." class="w-full border rounded px-4 py-2">
        </div>
        ${insumosOrdenados.length > 0 ? `
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-3 text-left text-sm font-medium">Nome</th>
                  <th class="px-4 py-3 text-left text-sm font-medium">Estoque</th>
                  <th class="px-4 py-3 text-left text-sm font-medium">Un</th>
                  <th class="px-4 py-3 text-left text-sm font-medium">Preço Médio</th>
                  <th class="px-4 py-3 text-left text-sm font-medium">Ações</th>
                </tr>
              </thead>
              <tbody id="insumos-tbody">
                ${insumosOrdenados.map(i => `
                  <tr class="border-t insumo-row ${i.quantidade <= i.estoqueMinimo ? 'bg-red-50' : ''}" data-nome="${i.nome.toLowerCase()}">
                    <td class="px-4 py-3">${i.nome}</td>
                    <td class="px-4 py-3">
                      <span class="${i.quantidade <= i.estoqueMinimo ? 'text-red-600 font-medium' : ''}">
                        ${i.quantidade.toFixed(2)}
                      </span>
                    </td>
                    <td class="px-4 py-3">${i.unidade}</td>
                    <td class="px-4 py-3">R$ ${i.precoMedio.toFixed(2)}</td>
                    <td class="px-4 py-3">
                      <div class="flex gap-2">
                        <button data-action="edit-insumo" data-id="${i.id}" class="text-blue-500 hover:text-blue-600">✏️</button>
                        <button data-action="delete-insumo" data-id="${i.id}" class="text-red-500 hover:text-red-600">🗑️</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        ` : `
          <div class="text-center py-12 text-gray-500">
            <div class="text-6xl mb-4">📦</div>
            <p>Nenhum insumo cadastrado</p>
            <button data-action="modal" data-modal="insumo" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
              Cadastrar Primeiro Insumo
            </button>
          </div>
        `}
      `;
    }

    function renderReceitas() {
      return `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold">Receitas</h2>
          <button data-action="modal" data-modal="receita" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            ➕ Nova Receita
          </button>
        </div>
        ${state.receitas.length > 0 ? `
          <div class="grid gap-4">
            ${state.receitas.map(r => `
              <div class="border rounded-lg p-4">
                <div class="flex justify-between items-start mb-3">
                  <div>
                    <h3 class="text-lg font-bold">${r.nome}</h3>
                    <p class="text-sm text-gray-600">Custo base: R$ ${r.custoTotal.toFixed(2)}</p>
                  </div>
                  <div class="flex gap-2">
                    <button data-action="edit-receita" data-id="${r.id}" class="text-blue-500 hover:text-blue-600">✏️</button>
                    <button data-action="delete-receita" data-id="${r.id}" class="text-red-500 hover:text-red-600">🗑️</button>
                  </div>
                </div>
                <div>
                  <p class="text-sm font-medium mb-1">Ingredientes:</p>
                  ${r.ingredientes.map(ing => {
                    const ins = state.insumos.find(x => x.id == ing.insumoId);
                    return `<p class="text-sm text-gray-600">• ${ins?.nome || 'Insumo'}: ${ing.quantidade} ${ins?.unidade || ''} (${ing.tipo === 'fixo' ? 'fixo' : 'por unid'})</p>`;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        ` : `
          <div class="text-center py-12 text-gray-500">
            <div class="text-6xl mb-4">📝</div>
            <p>Nenhuma receita cadastrada</p>
            <button data-action="modal" data-modal="receita" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
              Criar Primeira Receita
            </button>
          </div>
        `}
      `;
    }

    function renderProdutos() {
      const produtosFinais = state.produtos.filter(p => !p.ehIntermediario);
      const produtosIntermediarios = state.produtos.filter(p => p.ehIntermediario);
      
      return `
        <h2 class="text-2xl font-bold mb-4">🍧 Produtos</h2>
        
        <div class="flex gap-2 mb-4">
          <button data-action="modal" data-modal="producao" data-tipo="final" class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">
            🍧 Produzir Produto Final
          </button>
          <button data-action="modal" data-modal="producao" data-tipo="intermediario" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
            🧪 Produzir Intermediário
          </button>
        </div>

        <!-- Produtos Finais -->
        <div class="mb-6">
          <h3 class="text-xl font-bold mb-3 text-orange-600">🍧 Produtos Finais (Para Venda)</h3>
          ${produtosFinais.length > 0 ? `
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-orange-50">
                  <tr>
                    <th class="px-4 py-3 text-left text-sm font-medium">Produto</th>
                    <th class="px-4 py-3 text-left text-sm font-medium">Estoque</th>
                    <th class="px-4 py-3 text-left text-sm font-medium">Custo</th>
                    <th class="px-4 py-3 text-left text-sm font-medium">Preço</th>
                    <th class="px-4 py-3 text-left text-sm font-medium">Lucro</th>
                    <th class="px-4 py-3 text-left text-sm font-medium">Ações</th>
                  </tr>
                </thead>
                <tbody>
                  ${produtosFinais.map(p => `
                    <tr class="border-t">
                      <td class="px-4 py-3">${p.nome}</td>
                      <td class="px-4 py-3">${p.quantidade}</td>
                      <td class="px-4 py-3">R$ ${p.custoUnitario.toFixed(2)}</td>
                      <td class="px-4 py-3">R$ ${p.precoVenda.toFixed(2)}</td>
                      <td class="px-4 py-3 text-green-600 font-medium">R$ ${(p.precoVenda - p.custoUnitario).toFixed(2)}</td>
                      <td class="px-4 py-3">
                        <div class="flex gap-2">
                          <button data-action="edit-produto" data-id="${p.id}" class="text-blue-500 hover:text-blue-600">✏️</button>
                          <button data-action="delete-produto" data-id="${p.id}" class="text-red-500 hover:text-red-600">🗑️</button>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : `
            <div class="text-center py-8 bg-orange-50 rounded-lg">
              <p class="text-gray-500">Nenhum produto final em estoque</p>
            </div>
          `}
        </div>

        <!-- Produtos Intermediários -->
        <div>
          <h3 class="text-xl font-bold mb-3 text-purple-600">🧪 Produtos Intermediários (Viram Insumos)</h3>
          ${produtosIntermediarios.length > 0 ? `
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-purple-50">
                  <tr>
                    <th class="px-4 py-3 text-left text-sm font-medium">Produto</th>
                    <th class="px-4 py-3 text-left text-sm font-medium">Estoque</th>
                    <th class="px-4 py-3 text-left text-sm font-medium">Custo Unit.</th>
                    <th class="px-4 py-3 text-left text-sm font-medium">Ações</th>
                  </tr>
                </thead>
                <tbody>
                  ${produtosIntermediarios.map(p => `
                    <tr class="border-t">
                      <td class="px-4 py-3">${p.nome}</td>
                      <td class="px-4 py-3">${p.quantidade}</td>
                      <td class="px-4 py-3">R$ ${p.custoUnitario.toFixed(2)}</td>
                      <td class="px-4 py-3">
                        <div class="flex gap-2">
                          <button data-action="transferir-insumo" data-id="${p.id}" class="text-green-500 hover:text-green-600" title="Transferir para Insumos">📦</button>
                          <button data-action="delete-produto" data-id="${p.id}" class="text-red-500 hover:text-red-600">🗑️</button>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : `
            <div class="text-center py-8 bg-purple-50 rounded-lg">
              <p class="text-gray-500">Nenhum produto intermediário em estoque</p>
            </div>
          `}
        </div>
      `;
    }

    function renderVendas() {
      return `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold">Vendas</h2>
          <button data-action="modal" data-modal="venda" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
            ➕ Nova Venda
          </button>
        </div>
        ${state.vendas.length > 0 ? `

    function renderRelatorios() {
      // Calcular produtos mais vendidos
      const produtosVendidos = {};
      state.vendas.forEach(v => {
        v.itens.forEach(it => {
          if (!produtosVendidos[it.produtoId]) {
            produtosVendidos[it.produtoId] = {quantidade: 0, valor: 0};
          }
          produtosVendidos[it.produtoId].quantidade += it.quantidade;
          produtosVendidos[it.produtoId].valor += it.quantidade * it.precoUnitario;
        });
      });

      const rankingProdutos = Object.entries(produtosVendidos)
        .map(([id, data]) => {
          const prod = state.produtos.find(p => p.id == id);
          return {nome: prod?.nome || 'Produto', ...data};
        })
        .sort((a, b) => b.quantidade - a.quantidade)
        .slice(0, 5);

      // Clientes que mais compram
      const clientesCompras = {};
      state.vendas.forEach(v => {
        if (!clientesCompras[v.clienteId]) {
          clientesCompras[v.clienteId] = {total: 0, qtdCompras: 0};
        }
        clientesCompras[v.clienteId].total += v.valorFinal;
        clientesCompras[v.clienteId].qtdCompras++;
      });

      const rankingClientes = Object.entries(clientesCompras)
        .map(([id, data]) => {
          const cli = state.clientes.find(c => c.id == id);
          return {nome: cli?.nome || 'Cliente', ...data};
        })
        .sort((a, b) => b.total - a.total)
        .slice(0, 5);

      // Vendas por forma de pagamento
      const porPagamento = {};
      state.vendas.forEach(v => {
        if (!porPagamento[v.formaPagamento]) {
          porPagamento[v.formaPagamento] = 0;
        }
        porPagamento[v.formaPagamento] += v.valorFinal;
      });

      // Total de vendas e lucro
      const totalVendas = state.vendas.reduce((t, v) => t + v.valorFinal, 0);
      let lucroTotal = 0;
      state.vendas.forEach(v => {
        v.itens.forEach(it => {
          const prod = state.produtos.find(p => p.id == it.produtoId);
          if (prod) {
            lucroTotal += (prod.precoVenda - prod.custoUnitario) * it.quantidade;
          }
        });
      });

      return `
        <h2 class="text-2xl font-bold mb-4">📊 Relatórios</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg">
            <p class="text-sm text-blue-700">Total de Vendas</p>
            <p class="text-2xl font-bold text-blue-800">R$ ${totalVendas.toFixed(2)}</p>
            <p class="text-xs text-blue-600">${state.vendas.length} vendas realizadas</p>
          </div>
          <div class="bg-green-50 border border-green-200 p-4 rounded-lg">
            <p class="text-sm text-green-700">Lucro Total</p>
            <p class="text-2xl font-bold text-green-800">R$ ${lucroTotal.toFixed(2)}</p>
            <p class="text-xs text-green-600">Margem: ${totalVendas > 0 ? ((lucroTotal/totalVendas)*100).toFixed(1) : 0}%</p>
          </div>
          <div class="bg-purple-50 border border-purple-200 p-4 rounded-lg">
            <p class="text-sm text-purple-700">Ticket Médio</p>
            <p class="text-2xl font-bold text-purple-800">R$ ${state.vendas.length > 0 ? (totalVendas/state.vendas.length).toFixed(2) : '0.00'}</p>
            <p class="text-xs text-purple-600">Por venda</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="border rounded-lg p-4">
            <h3 class="font-bold mb-3 text-orange-700">🏆 Produtos Mais Vendidos</h3>
            ${rankingProdutos.length > 0 ? `
              <div class="space-y-2">
                ${rankingProdutos.map((p, i) => `
                  <div class="flex justify-between items-center border-b pb-2">
                    <div>
                      <p class="font-medium">${i+1}. ${p.nome}</p>
                      <p class="text-xs text-gray-500">${p.quantidade} unidades</p>
                    </div>
                    <p class="font-bold text-orange-600">R$ ${p.valor.toFixed(2)}</p>
                  </div>
                `).join('')}
              </div>
            ` : '<p class="text-sm text-gray-500">Nenhuma venda registrada</p>'}
          </div>

          <div class="border rounded-lg p-4">
            <h3 class="font-bold mb-3 text-blue-700">👥 Melhores Clientes</h3>
            ${rankingClientes.length > 0 ? `
              <div class="space-y-2">
                ${rankingClientes.map((c, i) => `
                  <div class="flex justify-between items-center border-b pb-2">
                    <div>
                      <p class="font-medium">${i+1}. ${c.nome}</p>
                      <p class="text-xs text-gray-500">${c.qtdCompras} compras</p>
                    </div>
                    <p class="font-bold text-blue-600">R$ ${c.total.toFixed(2)}</p>
                  </div>
                `).join('')}
              </div>
            ` : '<p class="text-sm text-gray-500">Nenhuma venda registrada</p>'}
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="border rounded-lg p-4">
            <h3 class="font-bold mb-3 text-green-700">💳 Vendas por Pagamento</h3>
            ${Object.keys(porPagamento).length > 0 ? `
              <div class="space-y-2">
                ${Object.entries(porPagamento).map(([forma, valor]) => `
                  <div class="flex justify-between items-center border-b pb-2">
                    <p class="font-medium capitalize">${forma}</p>
                    <p class="font-bold text-green-600">R$ ${valor.toFixed(2)}</p>
                  </div>
                `).join('')}
              </div>
            ` : '<p class="text-sm text-gray-500">Nenhuma venda registrada</p>'}
          </div>

          <div class="border rounded-lg p-4">
            <h3 class="font-bold mb-3 text-purple-700">💰 Custo dos Produtos</h3>
            ${state.produtos.length > 0 ? `
              <div class="space-y-2">
                ${state.produtos.map(p => {
                  const lucro = p.precoVenda - p.custoUnitario;
                  const margem = ((lucro / p.precoVenda) * 100).toFixed(1);
                  return `
                    <div class="border-b pb-2">
                      <div class="flex justify-between items-center">
                        <p class="font-medium">${p.nome}</p>
                        <p class="text-sm font-bold ${lucro > 0 ? 'text-green-600' : 'text-red-600'}">+R$ ${lucro.toFixed(2)}</p>
                      </div>
                      <div class="flex justify-between text-xs text-gray-600 mt-1">
                        <span>Custo: R$ ${p.custoUnitario.toFixed(2)}</span>
                        <span>Venda: R$ ${p.precoVenda.toFixed(2)}</span>
                        <span class="font-medium ${margem > 30 ? 'text-green-600' : margem > 15 ? 'text-orange-600' : 'text-red-600'}">${margem}%</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : '<p class="text-sm text-gray-500">Nenhum produto cadastrado</p>'}
          </div>
        </div>

        <div class="border rounded-lg p-4">
          <h3 class="font-bold mb-3 text-red-700">📦 Detalhamento de Custos</h3>
          ${state.produtos.length > 0 ? `
            <div class="space-y-4">
              ${state.produtos.map(p => {
                const receita = state.receitas.find(r => r.id == p.receitaId);
                if (!receita) return '';
                return `
                  <div class="bg-gray-50 p-3 rounded">
                    <p class="font-bold text-lg mb-2">${p.nome}</p>
                    <div class="text-sm">
                      <p class="font-medium mb-1">Ingredientes:</p>
                      ${receita.ingredientes.map(ing => {
                        const insumo = state.insumos.find(i => i.id == ing.insumoId);
                        if (!insumo) return '';
                        const custoIng = ing.quantidade * insumo.precoMedio;
                        return `
                          <div class="flex justify-between py-1 border-b">
                            <span>${insumo.nome} - ${ing.quantidade} ${insumo.unidade}</span>
                            <span class="font-medium">R$ ${custoIng.toFixed(2)}</span>
                          </div>
                        `;
                      }).join('')}
                      <div class="flex justify-between pt-2 font-bold">
                        <span>CUSTO TOTAL:</span>
                        <span class="text-red-600">R$ ${p.custoUnitario.toFixed(2)}</span>
                      </div>
                      <div class="flex justify-between text-green-700">
                        <span>Preço de Venda:</span>
                        <span class="font-bold">R$ ${p.precoVenda.toFixed(2)}</span>
                      </div>
                      <div class="flex justify-between text-blue-700 font-bold">
                        <span>Lucro por Unidade:</span>
                        <span>R$ ${(p.precoVenda - p.custoUnitario).toFixed(2)}</span>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : '<p class="text-sm text-gray-500">Nenhum produto cadastrado</p>'}
        </div>
      `;
    }

    function renderListaCompras() {

      return `

        ${insumosFaltando.length > 0 ? `
          <div class="bg-yellow-50 border border-yellow-200 p-4 rounded-lg mb-4">

          <div class="space-y-3">
            ${insumosFaltando.map(i => `

                      </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                      <div class="bg-gray-50 p-2 rounded">
                        <p class="text-gray-600">Estoque Mínimo</p>
                        <p class="font-bold">${i.estoqueMinimo.toFixed(2)} ${i.unidade}</p>
                      </div>
                      <div class="bg-blue-50 p-2 rounded">
                        <p class="text-gray-600">Sugestão de Compra</p>
                        <p class="font-bold text-blue-600">${(i.estoqueMinimo * 2 - i.quantidade).toFixed(2)} ${i.unidade}</p>
                      </div>
                    </div>
                    <div class="mt-2 text-xs text-gray-500">
                      <p>Preço médio: R$ ${i.precoMedio.toFixed(2)} por ${i.unidade}</p>

              </div>

            <p class="font-bold text-blue-800 mb-2">💡 Resumo da Compra</p>
            <p class="text-sm text-blue-700">Total de itens: ${insumosFaltando.length}</p>
            <p class="text-sm text-blue-700">Valor estimado total: R$ ${insumosFaltando.reduce((t, i) => t + ((i.estoqueMinimo * 2 - i.quantidade) * i.precoMedio), 0).toFixed(2)}</p>
          </div>
        ` : `
          <div class="text-center py-12">
            <div class="text-6xl mb-4">✅</div>
            <p class="text-xl font-bold text-green-600">Estoque em dia!</p>
            <p class="text-gray-600 mt-2">Todos os insumos estão acima do estoque mínimo</p>
          </div>
        `}
      `;
    }

          <div class="space-y-3">
            <div>
              <label class="block text-sm mb-1">Insumo</label>

            <div>
              <label class="block text-sm mb-1">Quantidade</label>

      } else if (state.modalType === 'venda') {
        const clientesOrdenados = [...state.clientes].sort((a, b) => a.nome.localeCompare(b.nome));
        modalContent = `
          <h3 class="text-xl font-bold mb-4">Nova Venda</h3>
          <div class="space-y-3" style="max-height: 70vh; overflow-y: auto;">
            <div>
              <label class="block text-sm mb-1">Cliente</label>
              <select id="clienteVenda" class="w-full border rounded px-3 py-2">
                <option value="">Selecione...</option>
                ${clientesOrdenados.map(c => `
                  <option value="${c.id}">${c.nome} ${c.saldo < 0 ? `(deve R$ ${Math.abs(c.saldo).toFixed(2)})` : c.saldo > 0 ? `(crédito R$ ${c.saldo.toFixed(2)})` : ''}</option>

            <div>

              </div>
              <div id="itens-venda-list"></div>
            </div>
            <div>
              <label class="block text-sm mb-1">Desconto (R$)</label>
              <input type="number" step="0.01" id="descontoVenda" class="w-full border rounded px-3 py-2" value="0">

            <div id="usar-credito-container"></div>
            <div>
              <label class="block text-sm mb-1">Pagamento</label>
              <select id="pagamentoVenda" class="w-full border rounded px-3 py-2">

                <option value="pix">Pix</option>

              <p class="text-sm" id="resumo-venda-text"></p>

            <div class="flex gap-2">
              <button data-action="save-venda" class="flex-1 bg-green-500 text-white rounded py-2">Finalizar</button>
              <button data-action="close-modal" class="flex-1 bg-gray-300 rounded py-2">Cancelar</button>
            </div>
          </div>
        `;
      } else if (state.modalType === 'pagamento') {
        const c = state.editingId ? state.clientes.find(x => x.id == state.editingId) : null;
        const divida = c ? Math.abs(c.saldo) : 0;
        modalContent = `
          <h3 class="text-xl font-bold mb-4">💰 Pagar Dívida</h3>
          <div class="space-y-3">
            <div class="bg-red-50 p-3 rounded border border-red-200">
              <p class="text-sm text-gray-600">Cliente: <span class="font-medium">${c?.nome}</span></p>
              <p class="text-lg font-bold text-red-600">Dívida Total: R$ ${divida.toFixed(2)}</p>
            </div>
            <div>
              <label class="block text-sm mb-1">Valor a Pagar (R$)</label>
              <input type="number" step="0.01" id="valorPagamento" class="w-full border rounded px-3 py-2" value="${divida.toFixed(2)}">
              <p class="text-xs text-gray-500 mt-1">Pode pagar parcial ou total</p>
            </div>
            <div>
              <label class="block text-sm mb-1">Forma de Pagamento</label>
              <select id="formaPagamento" class="w-full border rounded px-3 py-2">
                <option value="dinheiro">Dinheiro</option>
                <option value="pix">Pix</option>
                <option value="cartao">Cartão</option>
              </select>
            </div>
            <div class="flex gap-2">
              <button data-action="save-pagamento" class="flex-1 bg-green-500 text-white rounded py-2">Confirmar Pagamento</button>
              <button data-action="close-modal" class="flex-1 bg-gray-300 rounded py-2">Cancelar</button>
            </div>
          </div>
        `;
      }
      
      return `
        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
          <div class="bg-white rounded-lg p-6 max-w-md w-full">
            ${modalContent}
          </div>
        </div>
      `;
    }

    function attachEventListeners() {
      // Navegação por cards
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.activeTab = e.currentTarget.dataset.nav;
          render();
        });
      });

      // Botão voltar
      document.querySelectorAll('[data-action="voltar-dashboard"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeTab = 'dashboard';
          render();
        });
      });

      // Tabs (manter compatibilidade se necessário)
      document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.activeTab = e.currentTarget.dataset.tab;
          render();
        });
      });

      document.querySelectorAll('[data-action="modal"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.modalType = e.currentTarget.dataset.modal;
          state.editingId = null;
          state.showModal = true;
          render();
        });
      });

      document.querySelectorAll('[data-action="edit-cliente"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.editingId = e.currentTarget.dataset.id;
          state.modalType = 'cliente';
          state.showModal = true;
          render();
        });
      });

      document.querySelectorAll('[data-action="pagar-divida"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.editingId = e.currentTarget.dataset.id;
          state.modalType = 'pagamento';
          state.showModal = true;
          render();
        });
      });

      document.querySelectorAll('[data-action="edit-insumo"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.editingId = e.currentTarget.dataset.id;
          state.modalType = 'insumo';
          state.showModal = true;
          render();
        });
      });

      document.querySelectorAll('[data-action="edit-produto"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.editingId = e.currentTarget.dataset.id;
          state.modalType = 'produto';
          state.showModal = true;
          render();
        });
      });

      document.querySelectorAll('[data-action="edit-receita"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.editingId = e.currentTarget.dataset.id;
          state.modalType = 'receita';
          state.showModal = true;
          render();
          setTimeout(setupReceitaModal, 100);
        });
      });

      document.querySelectorAll('[data-action="delete-cliente"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.dataset.id;
          if (confirm('Tem certeza?')) {
            await deleteFromFirebase('clientes', id);
            state.clientes = state.clientes.filter(c => c.id != id);
            render();
          }
        });
      });

      document.querySelectorAll('[data-action="delete-insumo"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.dataset.id;
          if (confirm('Tem certeza?')) {
            await deleteFromFirebase('insumos', id);
            state.insumos = state.insumos.filter(i => i.id != id);
            render();
          }
        });
      });

      document.querySelectorAll('[data-action="delete-produto"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.dataset.id;
          if (confirm('Tem certeza?')) {
            await deleteFromFirebase('produtos', id);
            state.produtos = state.produtos.filter(p => p.id != id);
            render();
          }
        });
      });

      document.querySelectorAll('[data-action="transferir-insumo"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.dataset.id;
          const produto = state.produtos.find(p => p.id == id);
          
          if (!produto) return alert('Produto não encontrado');
          
          if (confirm(`Transferir ${produto.quantidade} unidades de "${produto.nome}" para insumos?`)) {
            const insumoExistente = state.insumos.find(i => i.nome.toLowerCase() === produto.nome.toLowerCase());
            
            if (insumoExistente) {
              const qtdTotal = insumoExistente.quantidade + produto.quantidade;
              const precoMedio = ((insumoExistente.quantidade * insumoExistente.precoMedio) + (produto.quantidade * produto.custoUnitario)) / qtdTotal;
              insumoExistente.quantidade = qtdTotal;
              insumoExistente.precoMedio = precoMedio;
              await saveToFirebase('insumos', insumoExistente.id, insumoExistente);
            } else {
              const novoInsumo = {
                id: Date.now(),
                nome: produto.nome,
                unidade: 'un',
                quantidade: produto.quantidade,
                precoMedio: produto.custoUnitario,
                estoqueMinimo: 10
              };
              await saveToFirebase('insumos', novoInsumo.id, novoInsumo);
              state.insumos.push(novoInsumo);
            }
            
            await deleteFromFirebase('produtos', produto.id);
            state.produtos = state.produtos.filter(p => p.id != id);
            
            alert(`✅ ${produto.nome} transferido para insumos!`);
            render();
          }
        });
      });

      document.querySelectorAll('[data-action="delete-receita"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.dataset.id;
          if (confirm('Tem certeza?')) {
            await deleteFromFirebase('receitas', id);
            state.receitas = state.receitas.filter(r => r.id != id);
            render();
          }
        });
      });

      document.querySelectorAll('[data-action="close-modal"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.showModal = false;
          state.editingId = null;
          render();
        });
      });

      document.querySelectorAll('[data-action="save-cliente"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const nome = document.getElementById('nome').value;
          const telefone = document.getElementById('telefone').value;
          const saldo = parseFloat(document.getElementById('saldo').value);
          
          if (!nome) return alert('Preencha o nome');
          
          if (state.editingId) {
            const cliente = state.clientes.find(c => c.id == state.editingId);
            if (cliente) {
              cliente.nome = nome;
              cliente.telefone = telefone;
              cliente.saldo = saldo;
              await saveToFirebase('clientes', cliente.id, cliente);
            }
          } else {
            const novoCliente = {id: Date.now(), nome, telefone, saldo};
            await saveToFirebase('clientes', novoCliente.id, novoCliente);
            state.clientes.push(novoCliente);
          }
          
          state.showModal = false;
          state.editingId = null;
          render();
        });
      });

      document.querySelectorAll('[data-action="save-pagamento"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const valorPago = parseFloat(document.getElementById('valorPagamento').value);
          const forma = document.getElementById('formaPagamento').value;
          
          if (!valorPago || valorPago <= 0) return alert('Informe o valor do pagamento');
          
          const cliente = state.clientes.find(c => c.id == state.editingId);
          if (!cliente) return alert('Cliente não encontrado');
          
          cliente.saldo += valorPago;
          await saveToFirebase('clientes', cliente.id, cliente);
          
          const mov = {
            id: Date.now(),
            tipo: 'entrada',
            data: new Date().toISOString(),
            descricao: `Pagamento - ${cliente.nome} (${forma})`,
            valor: valorPago
          };
          await saveToFirebase('movimentacoes', mov.id, mov);
          state.movimentacoes.push(mov);
          
          state.showModal = false;
          state.editingId = null;
          render();
        });
      });

      document.querySelectorAll('[data-action="save-insumo"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const nome = document.getElementById('nome').value;
          const unidade = document.getElementById('unidade').value;
          const estoqueMinimo = parseFloat(document.getElementById('estoqueMinimo').value);
          
          if (!nome) return alert('Preencha o nome');
          
          if (state.editingId) {
            const insumo = state.insumos.find(i => i.id == state.editingId);
            if (insumo) {
              insumo.nome = nome;
              insumo.unidade = unidade;
              insumo.estoqueMinimo = estoqueMinimo;
              await saveToFirebase('insumos', insumo.id, insumo);
            }
          } else {
            const quantidade = parseFloat(document.getElementById('quantidade').value);
            const valorTotal = parseFloat(document.getElementById('valorTotal').value);
            const precoMedio = quantidade > 0 ? valorTotal / quantidade : 0;
            
            const novoInsumo = {id: Date.now(), nome, unidade, quantidade, precoMedio, estoqueMinimo};
            await saveToFirebase('insumos', novoInsumo.id, novoInsumo);
            state.insumos.push(novoInsumo);
          }
          
          state.showModal = false;
          state.editingId = null;
          render();
        });
      });

      document.querySelectorAll('[data-action="save-produto"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const precoVenda = parseFloat(document.getElementById('precoVenda').value);
          
          if (state.editingId) {
            const produto = state.produtos.find(p => p.id == state.editingId);
            if (produto) {
              produto.precoVenda = precoVenda;
              await saveToFirebase('produtos', produto.id, produto);
            }
          }
          
          state.showModal = false;
          state.editingId = null;
          render();
        });
      });

      // Sistema de receitas
      let ingredientesReceita = [];

      function setupReceitaModal() {
        const receita = state.editingId ? state.receitas.find(r => r.id == state.editingId) : null;
        ingredientesReceita = receita ? JSON.parse(JSON.stringify(receita.ingredientes)) : [];
        
        renderIngredientesReceita();

        document.querySelectorAll('[data-action="add-ingrediente"]').forEach(btn => {
          btn.onclick = () => {
            ingredientesReceita.push({insumoId: '', quantidade: '', tipo: 'fixo'});
            renderIngredientesReceita();
          };
        });

        document.querySelectorAll('[data-action="save-receita"]').forEach(btn => {
          btn.onclick = async () => {
            const nome = document.getElementById('nomeReceita').value;
            if (!nome || ingredientesReceita.length === 0) return alert('Preencha nome e ingredientes');

            const custo = ingredientesReceita.reduce((t, ing) => {
              const ins = state.insumos.find(i => i.id == ing.insumoId);
              if (!ins || !ing.quantidade) return t;
              return t + (parseFloat(ing.quantidade) * ins.precoMedio);
            }, 0);

            if (state.editingId) {
              const receita = state.receitas.find(r => r.id == state.editingId);
              if (receita) {
                receita.nome = nome;
                receita.ingredientes = ingredientesReceita.map(i => ({
                  insumoId: parseInt(i.insumoId),
                  quantidade: parseFloat(i.quantidade),
                  tipo: i.tipo
                }));
                receita.custoTotal = custo;
                await saveToFirebase('receitas', receita.id, receita);
              }
            } else {
              const novaReceita = {
                id: Date.now(),
                nome,
                ingredientes: ingredientesReceita.map(i => ({
                  insumoId: parseInt(i.insumoId),
                  quantidade: parseFloat(i.quantidade),
                  tipo: i.tipo
                })),
                custoTotal: custo
              };
              await saveToFirebase('receitas', novaReceita.id, novaReceita);
              state.receitas.push(novaReceita);
            }

            ingredientesReceita = [];
            state.showModal = false;
            state.editingId = null;
            render();
          };
        });
      }

      function renderIngredientesReceita() {
        const list = document.getElementById('ingredientes-list');
        if (!list) return;

        const insumosOrdenados = [...state.insumos].sort((a, b) => a.nome.localeCompare(b.nome));

        list.innerHTML = ingredientesReceita.map((ing, i) => `
          <div class="flex gap-2 items-center">
            <select class="flex-1 border rounded px-2 py-1 text-sm" data-ing-field="insumoId" data-ing-index="${i}">
              <option value="">Selecione...</option>
              ${insumosOrdenados.map(ins => `<option value="${ins.id}" ${ing.insumoId == ins.id ? 'selected' : ''}>${ins.nome}</option>`).join('')}
            </select>
            <input type="number" step="0.01" placeholder="Qtd" class="w-20 border rounded px-2 py-1 text-sm" data-ing-field="quantidade" data-ing-index="${i}" value="${ing.quantidade}">
            <select class="w-24 border rounded px-2 py-1 text-sm" data-ing-field="tipo" data-ing-index="${i}">
              <option value="fixo" ${ing.tipo === 'fixo' ? 'selected' : ''}>Fixo</option>
              <option value="por_unidade" ${ing.tipo === 'por_unidade' ? 'selected' : ''}>Por unid.</option>
            </select>
            <button type="button" data-action="remove-ing" data-ing-index="${i}" class="text-red-500 hover:text-red-600 px-2">🗑️</button>
          </div>
        `).join('');

        list.querySelectorAll('[data-ing-field]').forEach(el => {
          el.addEventListener('change', (e) => {
            const idx = parseInt(e.target.dataset.ingIndex);
            const field = e.target.dataset.ingField;
            ingredientesReceita[idx][field] = e.target.value;
          });
        });

        list.querySelectorAll('[data-action="remove-ing"]').forEach(el => {
          el.addEventListener('click', (e) => {
            const idx = parseInt(e.target.dataset.ingIndex);
            ingredientesReceita.splice(idx, 1);
            renderIngredientesReceita();
          });
        });
      }

      if (state.modalType === 'receita') {
        setupReceitaModal();
      }

      document.querySelectorAll('[data-action="save-producao"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const receitaId = document.getElementById('receitaId').value;
          const lotes = parseFloat(document.getElementById('lotes').value);
          const rendimento = parseFloat(document.getElementById('rendimento').value);
          const tipoProducao = btn.dataset.tipo || 'final';
          const ehIntermediario = tipoProducao === 'intermediario';
          
          const precoVendaInput = document.getElementById('precoVenda');
          const precoVenda = precoVendaInput ? parseFloat(precoVendaInput.value) : 0;
          
          if (!receitaId || !lotes || !rendimento) {
            return alert('Preencha todos os campos obrigatórios');
          }
          
          if (!ehIntermediario && !precoVenda) {
            return alert('Preencha o preço de venda');
          }
          
          const receita = state.receitas.find(r => r.id == receitaId);
          if (!receita) return alert('Receita não encontrada');
          
          let custoTotal = 0;
          for (let ing of receita.ingredientes) {
            const insumo = state.insumos.find(i => i.id == ing.insumoId);
            if (!insumo) continue;
            const qtdUsada = ing.tipo === 'por_unidade' ? ing.quantidade * rendimento : ing.quantidade * lotes;
            custoTotal += qtdUsada * insumo.precoMedio;
          }
          
          const custoUnitario = custoTotal / rendimento;
          
          for (let ing of receita.ingredientes) {
            const insumo = state.insumos.find(i => i.id == ing.insumoId);
            if (!insumo) continue;
            const qtdUsada = ing.tipo === 'por_unidade' ? ing.quantidade * rendimento : ing.quantidade * lotes;
            insumo.quantidade -= qtdUsada;
            await saveToFirebase('insumos', insumo.id, insumo);
          }
          
          const produtoExistente = state.produtos.find(p => p.receitaId == receita.id && p.ehIntermediario == ehIntermediario);
          
          if (produtoExistente) {
            produtoExistente.quantidade += rendimento;
            await saveToFirebase('produtos', produtoExistente.id, produtoExistente);
          } else {
            const novoProduto = {
              id: Date.now(),
              receitaId: receita.id,
              nome: receita.nome,
              quantidade: rendimento,
              custoUnitario,
              precoVenda: ehIntermediario ? custoUnitario : precoVenda,
              estoqueMinimo: 10,
              ehIntermediario: ehIntermediario
            };
            await saveToFirebase('produtos', novoProduto.id, novoProduto);
            state.produtos.push(novoProduto);
          }
          
          state.showModal = false;
          await loadAllData();
        });
      });

      document.querySelectorAll('[data-action="save-entrada"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const insumoId = document.getElementById('insumoId').value;
          const qtd = parseFloat(document.getElementById('qtdEntrada').value);
          const val = parseFloat(document.getElementById('valEntrada').value);
          
          if (!insumoId || !qtd || !val) return alert('Preencha todos os campos');
          
          const insumo = state.insumos.find(i => i.id == insumoId);
          if (!insumo) return alert('Insumo não encontrado');
          
          const precoNovo = val / qtd;
          const qtdTotal = insumo.quantidade + qtd;
          const precoMedio = ((insumo.quantidade * insumo.precoMedio) + (qtd * precoNovo)) / qtdTotal;
          
          insumo.quantidade = qtdTotal;
          insumo.precoMedio = precoMedio;
          
          await saveToFirebase('insumos', insumo.id, insumo);
          state.showModal = false;
          render();
        });
      });

      // Busca de clientes
      const searchCliente = document.getElementById('search-cliente');
      if (searchCliente) {
        searchCliente.addEventListener('input', (e) => {
          const termo = e.target.value.toLowerCase();
          document.querySelectorAll('.cliente-row').forEach(row => {
            const nome = row.dataset.nome;
            row.style.display = nome.includes(termo) ? '' : 'none';
          });
        });
      }

      // Busca de insumos
      const searchInsumo = document.getElementById('search-insumo');
      if (searchInsumo) {
        searchInsumo.addEventListener('input', (e) => {
          const termo = e.target.value.toLowerCase();
          document.querySelectorAll('.insumo-row').forEach(row => {
            const nome = row.dataset.nome;
            row.style.display = nome.includes(termo) ? '' : 'none';
          });
        });
      }

      // Sistema de Vendas
      let itensVenda = [];
      let usarCredito = false;

      if (state.modalType === 'venda') {
        setupVendaModal();
      }

      function setupVendaModal() {
        renderItensVenda();

        document.querySelectorAll('[data-action="add-item-venda"]').forEach(btn => {
          btn.onclick = () => {
            itensVenda.push({produtoId: '', quantidade: 1});
            renderItensVenda();
          };
        });

        const descontoInput = document.getElementById('descontoVenda');
        const clienteSelect = document.getElementById('clienteVenda');
        if (descontoInput) descontoInput.addEventListener('input', calcularResumoVenda);
        if (clienteSelect) clienteSelect.addEventListener('change', calcularResumoVenda);

        document.querySelectorAll('[data-action="save-venda"]').forEach(btn => {
          btn.onclick = async () => {
            const cliId = document.getElementById('clienteVenda').value;
            const desconto = parseFloat(document.getElementById('descontoVenda').value || 0);
            const pagamento = document.getElementById('pagamentoVenda').value;

            if (!cliId || itensVenda.length === 0) {
              return alert('Preencha cliente e produtos');
            }

            for (let item of itensVenda) {
              const p = state.produtos.find(pr => pr.id == item.produtoId);
              if (!p || p.quantidade < item.quantidade) {
                return alert(`Estoque insuficiente: ${p?.nome || 'produto'}`);
              }
            }

            const cliente = state.clientes.find(c => c.id == cliId);
            const creditoDisponivel = cliente.saldo > 0 ? cliente.saldo : 0;

            const subtotal = itensVenda.reduce((t, item) => {
              const p = state.produtos.find(pr => pr.id == item.produtoId);
              return t + (p.precoVenda * item.quantidade);
            }, 0);

            const creditoUsado = usarCredito ? Math.min(creditoDisponivel, subtotal - desconto) : 0;
            const valorFinal = subtotal - desconto - creditoUsado;

            const itensAgrupados = {};
            itensVenda.forEach(item => {
              const id = parseInt(item.produtoId);
              if (itensAgrupados[id]) {
                itensAgrupados[id].quantidade += item.quantidade;
              } else {
                const p = state.produtos.find(pr => pr.id == id);
                itensAgrupados[id] = {
                  produtoId: id,
                  quantidade: item.quantidade,
                  precoUnitario: p.precoVenda
                };
              }
            });

            for (let id in itensAgrupados) {
              const produto = state.produtos.find(p => p.id == id);
              if (produto) {
                produto.quantidade -= itensAgrupados[id].quantidade;
                await saveToFirebase('produtos', produto.id, produto);
              }
            }

            let novoSaldo = cliente.saldo;
            if (usarCredito && creditoUsado > 0) {
              novoSaldo -= creditoUsado;
            }
            if (pagamento === 'fiado') {
              novoSaldo -= valorFinal;
            }

            cliente.saldo = novoSaldo;
            await saveToFirebase('clientes', cliente.id, cliente);

            const novaVenda = {
              id: Date.now(),
              data: new Date().toISOString(),
              clienteId: parseInt(cliId),
              itens: Object.values(itensAgrupados),
              subtotal,
              desconto,
              creditoUsado,
              valorFinal,
              formaPagamento: pagamento
            };

            await saveToFirebase('vendas', novaVenda.id, novaVenda);
            state.vendas.push(novaVenda);

            if (pagamento !== 'fiado') {
              const mov = {
                id: Date.now() + 1,
                tipo: 'entrada',
                data: new Date().toISOString(),
                descricao: `Venda - ${cliente.nome} (${pagamento})`,
                valor: valorFinal
              };
              await saveToFirebase('movimentacoes', mov.id, mov);
              state.movimentacoes.push(mov);
            }

            itensVenda = [];
            usarCredito = false;
            state.showModal = false;
            await loadAllData();
          };
        });
      }

      function renderItensVenda() {
        const list = document.getElementById('itens-venda-list');
        if (!list) return;

        list.innerHTML = itensVenda.map((item, i) => `
          <div class="flex gap-2 mb-2">
            <select class="flex-1 border rounded px-3 py-2" data-item-field="produtoId" data-item-index="${i}">
              <option value="">Selecione...</option>
              ${state.produtos.map(p => `<option value="${p.id}" ${item.produtoId == p.id ? 'selected' : ''}>${p.nome} - R$ ${p.precoVenda.toFixed(2)} (est: ${p.quantidade})</option>`).join('')}
            </select>
            <input type="number" min="1" placeholder="Qtd" class="w-20 border rounded px-3 py-2" data-item-field="quantidade" data-item-index="${i}" value="${item.quantidade}">
            <button type="button" data-action="remove-item" data-item-index="${i}" class="text-red-500 hover:text-red-600 px-2">🗑️</button>
          </div>
        `).join('');

        list.querySelectorAll('[data-item-field]').forEach(el => {
          el.addEventListener('change', (e) => {
            const idx = parseInt(e.target.dataset.itemIndex);
            const field = e.target.dataset.itemField;
            itensVenda[idx][field] = field === 'quantidade' ? parseInt(e.target.value) : e.target.value;
            calcularResumoVenda();
          });
        });

        list.querySelectorAll('[data-action="remove-item"]').forEach(el => {
          el.addEventListener('click', (e) => {
            const idx = parseInt(e.target.dataset.itemIndex);
            itensVenda.splice(idx, 1);
            renderItensVenda();
          });
        });

        calcularResumoVenda();
      }

      function calcularResumoVenda() {
        const cliId = document.getElementById('clienteVenda')?.value;
        const desconto = parseFloat(document.getElementById('descontoVenda')?.value || 0);
        
        const cliente = state.clientes.find(c => c.id == cliId);
        const creditoDisponivel = cliente && cliente.saldo > 0 ? cliente.saldo : 0;

        const subtotal = itensVenda.reduce((t, item) => {
          const p = state.produtos.find(pr => pr.id == item.produtoId);
          if (!p) return t;
          return t + (p.precoVenda * (parseInt(item.quantidade) || 0));
        }, 0);

        const creditoUsado = usarCredito ? Math.min(creditoDisponivel, subtotal - desconto) : 0;
        const valorFinal = subtotal - desconto - creditoUsado;

        const creditoContainer = document.getElementById('usar-credito-container');
        if (creditoContainer) {
          if (creditoDisponivel > 0) {
            creditoContainer.innerHTML = `
              <div class="p-3 bg-green-50 rounded">
                <label class="flex items-center gap-2">
                  <input type="checkbox" id="checkbox-credito" ${usarCredito ? 'checked' : ''}>
                  <span class="text-sm">Usar crédito: R$ ${creditoDisponivel.toFixed(2)}</span>
                </label>
              </div>
            `;
            document.getElementById('checkbox-credito')?.addEventListener('change', (e) => {
              usarCredito = e.target.checked;
              calcularResumoVenda();
            });
          } else {
            creditoContainer.innerHTML = '';
          }
        }

        const resumo = document.getElementById('resumo-venda');
        const resumoText = document.getElementById('resumo-venda-text');
        if (resumo && resumoText && itensVenda.length > 0) {
          resumoText.innerHTML = `
            Subtotal: R$ ${subtotal.toFixed(2)}<br>
            ${desconto > 0 ? `<span class="text-red-600">Desconto: -R$ ${desconto.toFixed(2)}</span><br>` : ''}
            ${creditoUsado > 0 ? `<span class="text-green-600">Crédito: -R$ ${creditoUsado.toFixed(2)}</span><br>` : ''}
            <span class="font-bold text-blue-700">Total: R$ ${valorFinal.toFixed(2)}</span>
          `;
          resumo.classList.remove('hidden');
        } else if (resumo) {
          resumo.classList.add('hidden');
        }
      }
    }

    loadAllData();
  </script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker
        .register("/sw.js")
        .then((reg) => console.log("SW registrado:", reg))
        .catch((err) => console.log("Falha no SW:", err));
    });
  }
</script>
</body>
</html>
